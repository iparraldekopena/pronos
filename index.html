<html lang="fr">
<head>

  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #161b22;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid #e2e6ec;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
      background: #ffffff;
    }
    .title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 900;
    }
    .sub {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #57606a;
    }
    .club {
      font-size: 1rem;
      font-weight: 900;
      color: #cf222e;
      text-transform: uppercase;
    }
    .card {
      border: 1px solid #e2e6ec;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      background: #ffffff;
    }
    .hidden {
      display: none !important;
    }
    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cfd7de;
      background: #ffffff;
      color: #161b22;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    button.primary {
      background: #cf222e;
      border-color: #cf222e;
      color: #ffffff;
    }
    button.active {
      background: #cf222e;
      border-color: #cf222e;
      color: #ffffff;
    }
    .err {
      color: #cf222e;
      font-weight: 700;
      margin-top: 8px;
    }
    .ok {
      color: #1a7f37;
      font-weight: 700;
      margin-top: 8px;
    }
    .muted {
      color: #57606a;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #e2e6ec;
      text-align: left;
    }
    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #57606a;
    }
    th.prono-col, td.prono-col {
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
    }
    td.pts-col {
      font-weight: 700;
    }
    .champ-tag {
      font-style: italic;
      color: #1a7f37;
      margin-left: 6px;
    }
    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .palm-card {
      border: 1px solid #e2e6ec;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }
    .palm-head {
      padding: 10px 14px;
      border-bottom: 1px solid #e2e6ec;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .palm-rows {
      padding: 10px 14px;
      display: grid;
      gap: 6px;
    }
    .palm-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid #eef1f4;
      font-size: 0.9rem;
    }
    .palm-row.p1 {
      background: #fde8ea;
      border-color: #f3b4ba;
      font-weight: 700;
    }
    .palm-rank {
      font-weight: 800;
      min-width: 34px;
    }
  </style>
</head>

  <div class="wrap">
    <header>
      <div>
        <h1 class="title">IPARRALDEKO PEÑA</h1>
        <div class="sub">EUSKAL HERRIA</div>
      </div>
      <div class="club">ATHLETIC CLUB</div>
      <div id="nav" class="hidden" style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="tab-pronos" class="active" type="button">Pronos & Classement</button>
        <button id="tab-palm" type="button">Palmarès</button>
        <button id="btn-logout" type="button">Déconnexion</button>
      </div>
    </header>

    <section id="sec-login" class="card">
      <h2 style="margin-top:0;">Connexion</h2>
      <p class="muted">Entre ton code membre (ex. ALAIN-08) ou ADMIN-PENA.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="code-in" type="text" placeholder="Code d'accès" />
        <button id="btn-login" class="primary" type="button">Se connecter</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <section id="sec-user" class="card hidden">
      <div><strong>Connecté :</strong> <span id="user-label"></span></div>
      <div id="user-pts" class="muted" style="margin-top:4px;"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <div class="card">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <label for="match-select" class="muted">Match :</label>
          <select id="match-select"></select>
        </div>
        <h3 id="match-title" style="margin:0 0 4px;"></h3>
        <div id="match-meta" class="muted"></div>

        <div id="pred-box" class="hidden" style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span id="lbl-home"></span>
          <input id="pred-h" type="number" min="0" style="width:70px; text-align:center;" />
          <span>-</span>
          <input id="pred-a" type="number" min="0" style="width:70px; text-align:center;" />
          <span id="lbl-away"></span>
          <button id="btn-save-pred" class="primary" type="button">Valider prono</button>
        </div>
        <div id="pred-ok" class="ok"></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Classement général</h2>
        <div id="part-info" class="muted"></div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Joueur</th>
              <th id="th-prono" class="prono-col">PRONO N° 13</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>
    </main>

    <section id="view-palm" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Palmarès de la Peña</h2>
        <div id="palm-grid" class="palm-grid"></div>
      </div>
    </section>
  </div>

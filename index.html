<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg-page: #f6f7f9;
      --bg-card: #ffffff;
      --bg-white: #ffffff;
      --text-main: #14181f;
      --text-muted: #5b6575;
      --border: #e3e7ee;
      --accent: #c81d25;
      --accent-soft: #fde8ea;
      --accent-border: #f3b4ba;
      --green-soft: #e6f6ec;
      --green-border: #9fd8b5;
      --green-text: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .top-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .top-meta {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-club {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      max-width: 100%;
      width: 680px;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    .logo-fallback {
      background: var(--accent);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 1px;
    }

    .aupa-banner {
      width: 100%;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .aupa-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
    }

    .hidden { display: none !important; }

    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cfd6e0;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--text-main);
    }

    button { cursor: pointer; font-weight: 700; }
    button.primary, button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .err { color: var(--accent); font-weight: 700; margin-top: 8px; }
    .ok { color: var(--green-text); font-weight: 700; margin-top: 8px; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-white);
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      background: var(--bg-white);
      color: var(--text-main);
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th.prono-col, td.prono-col {
      background: var(--bg-white);
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      border-left: 1px solid #edf0f5;
      border-right: 1px solid #edf0f5;
    }

    td.pts-col { font-weight: 800; text-align: right; }

    tr.row-champ td, tr.row-champ td.prono-col { background: var(--accent-soft); }
    tr.row-me td, tr.row-me td.prono-col { background: var(--green-soft); }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .tag-champ { background: #fbd2d7; color: #8f131b; }
    .tag-me { background: #c7ebd4; color: var(--green-text); }

    .palm-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cup-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .palm-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-white);
    }

    .palm-card.is-holder {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .palm-head {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }

    .palm-card.is-holder .palm-head {
      background: var(--accent-soft);
      border-bottom-color: var(--accent-border);
    }

    .palm-rows { padding: 12px 14px; display: grid; gap: 7px; }

    .palm-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #eef1f5;
      background: #ffffff;
      font-size: 0.9rem;
    }

    .palm-row.p1 {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      font-weight: 800;
    }

    .palm-rank { font-weight: 800; min-width: 34px; }
  </style>
</head>

      </nav>
    </header>

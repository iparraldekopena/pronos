<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics & Classement</title>
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #141820;
      --surface-2: #1b202b;
      --focus-bg: #000000;
      --border: #2a3140;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --gold: #f59e0b;
      --me-bg: rgba(59, 130, 246, 0.14);
      --me-border: rgba(59, 130, 246, 0.45);
      --champ-bg: rgba(245, 158, 11, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* En-tête et navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #252c3b;
    }

    button.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    button.btn-red {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-red:hover {
      background: var(--accent-hover);
    }

    /* Connexion */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .login-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
    }

    .err {
      color: #fb7185;
      margin-top: 8px;
      min-height: 1.2em;
      font-size: 0.92rem;
    }

    /* Bandeau membre */
    .aupa-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .aupa-heading {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .aupa-stats {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Match Focus */
    .match-focus {
      background: var(--focus-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 20px;
      margin-bottom: 22px;
      text-align: center;
    }

    .match-selector-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .match-title {
      font-size: clamp(1.45rem, 3.6vw, 2.35rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      margin: 0 0 10px;
      letter-spacing: 0.01em;
    }

    .match-meta {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .pred-box {
      margin-top: 16px;
      padding-top: 18px;
      border-top: 1px solid #1f2430;
    }

    .pred-teams-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .team-big {
      font-size: clamp(1.15rem, 2.5vw, 1.65rem);
      font-weight: 800;
      min-width: 150px;
      text-align: center;
    }

    .score-input {
      width: 72px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .score-sep {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pred-ok {
      margin-top: 10px;
      color: #4ade80;
      font-weight: 600;
      min-height: 1.3em;
    }

    /* Classement */
    .lb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .lb-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .prono-col,
    .pts-col {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .pts-col {
      font-weight: 700;
    }

    tr.row-champ {
      background: var(--champ-bg);
    }

    tr.row-me {
      background: var(--me-bg);
      outline: 1px solid var(--me-border);
    }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      vertical-align: middle;
    }

    .tag-champ {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .tag-me {
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
    }

    .cup-plain {
      margin-left: 6px;
      background: none;
      border: none;
      padding: 0;
      font-size: 1rem;
      vertical-align: middle;
    }

    /* Palmarès */
    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .palm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .palm-card.is-holder {
      border-color: var(--gold);
    }

    .palm-head {
      background: var(--surface-2);
      padding: 12px 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    .palm-rows {
      padding: 10px 16px;
    }

    .palm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .palm-row:last-child {
      border-bottom: none;
    }

    .palm-row.p1 {
      font-weight: 700;
    }

    .palm-rank {
      min-width: 28px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="brand">IPARRALDEKO PEÑA</div>
      <div id="nav" class="nav hidden">
        <button id="tab-pronos" type="button" class="active" onclick="window.setTab('pronos')">Pronostics & Classement</button>
        <button id="tab-palm" type="button" onclick="window.setTab('palm')">Palmarès</button>
        <button type="button" onclick="window.doLogout()">Déconnexion</button>
      </div>
    </div>

    <div id="member-logo" class="muted hidden" style="margin-bottom: 12px;">Espace Membres — Saison en cours</div>

    <section id="sec-login" class="card">
      <h1 style="margin: 0 0 8px; font-size: 1.35rem;">Connexion joueur</h1>
      <p class="muted" style="margin: 0;">Saisis ton code membre pour accéder aux pronostics et au classement.</p>
      <div class="login-row">
        <input id="code-in" type="text" placeholder="Ex. ALAIN-01" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();window.doLogin();}" />
        <button type="button" class="btn-red" onclick="window.doLogin()">Entrer</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <section id="aupa-banner" class="aupa-banner hidden">
      <div>
        <h2 id="aupa-heading" class="aupa-heading">AUPA !</h2>
        <div id="aupa-sub" class="muted"></div>
      </div>
      <div id="aupa-stats" class="aupa-stats"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <section class="match-focus">
        <div class="match-selector-bar">
          <select id="match-select" onchange="window.showMatch(this.value)"></select>
        </div>
        <h2 id="match-title" class="match-title"></h2>
        <div id="match-meta" class="match-meta"></div>

        <div id="pred-box" class="pred-box hidden">
          <div class="pred-teams-row">
            <span id="lbl-home" class="team-big"></span>
            <input id="pred-h" class="score-input" type="number" min="0" max="99" placeholder="-" />
            <span class="score-sep">-</span>
            <input id="pred-a" class="score-input" type="number" min="0" max="99" placeholder="-" />
            <span id="lbl-away" class="team-big"></span>
          </div>
          <button type="button" class="btn-red" onclick="window.savePred()">Valider Prono</button>
          <div id="pred-ok" class="pred-ok"></div>
        </div>
      </section>

      <section class="card">
        <div class="lb-header">
          <h2>Classement général</h2>
          <div id="part-info" class="muted"></div>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width: 56px;">#</th>
              <th>Joueur</th>
              <th id="th-prono" class="prono-col">PRONO</th>
              <th class="pts-col">POINTS</th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </section>
    </main>

    <section id="view-palm" class="hidden">
      <div id="palm-grid" class="palm-grid"></div>
    </section>
  </div>

  <script>
    window.DB_URL = window.DB_URL || "";

    window.MEMBERS = [
      { code: "ARIAS-01", name: "ARIAS RUIZ Jorge", points: 0, isChamp: false },
      { code: "BARRUTIA-01", name: "BARRUTIA Xabier", points: 0, isChamp: false },
      { code: "CAZAURAN-01", name: "CAZAURAN Jean-Yves", points: 0, isChamp: false },
      { code: "CORDEIRO-01", name: "CORDEIRO Jonathan", points: 0, isChamp: false },
      { code: "CROUZAT-F", name: "CROUZAT Frédéric", points: 0, isChamp: false },
      { code: "CROUZAT-I", name: "CROUZAT Inko", points: 0, isChamp: false },
      { code: "CROUZAT-L", name: "CROUZAT Luken", points: 0, isChamp: false },
      { code: "CURUTCHARRY-01", name: "CURUTCHARRY Pierre", points: 0, isChamp: false },
      { code: "DIAZ-DEBAT-01", name: "DIAZ-DEBAT Bertrand", points: 0, isChamp: false },
      { code: "DULONG-01", name: "DULONG Xina", points: 0, isChamp: false },
      { code: "ESCALANTE-01", name: "ESCALANTE Ange", points: 0, isChamp: false },
      { code: "FERNANDEZ-01", name: "FERNANDEZ Adrian", points: 0, isChamp: false },
      { code: "GOBBI-01", name: "GOBBI Olivier", points: 0, isChamp: false },
      { code: "GOYENEIX-01", name: "GOYENEIX Pierre", points: 0, isChamp: false },
      { code: "ALAIN-01", name: "LABORDE Alain", points: 0, isChamp: false },
      { code: "JULEN-03", name: "LABORDE Julen", points: 0, isChamp: true },
      { code: "LOREA-01", name: "LABORDE Lorea", points: 0, isChamp: false },
      { code: "LEGRAS-01", name: "LEGRAS Peio", points: 0, isChamp: false },
      { code: "MARITORENA-01", name: "MARITORENA Christophe", points: 0, isChamp: false },
      { code: "MENDIOLA-I", name: "MENDIOLA Iñaki", points: 0, isChamp: false },
      { code: "MENDIOLA-L", name: "MENDIOLA Lander", points: 0, isChamp: false },
      { code: "PARRILLA-01", name: "PARRILLA ETCHART Xabier", points: 0, isChamp: false },
      { code: "PONTACQ-01", name: "PONTACQ Jean-Louis", points: 0, isChamp: false },
      { code: "QUEYROU-01", name: "QUEYROU Yannick", points: 0, isChamp: false },
      { code: "ROCHE-01", name: "ROCHE Pierrick", points: 0, isChamp: false },
      { code: "SANCHEZ-01", name: "SANCHEZ Gorka", points: 0, isChamp: false },
      { code: "ANDONI-02", name: "URREIZTIETA Andoni", points: 0, isChamp: false }
    ];

    window.MATCHES = [
      { id: "m13", num: 13, comp: "Liga", dayName: "Vendredi", date: "20 Novembre", time: "21:00", stadium: "San Mamés", home: "ATHLETIC CLUB", away: "RCD ESPANYOL", finished: true, fh: 0, fa: 1 },
      { id: "m14", num: 14, comp: "Liga", dayName: "samedi", date: "28 novembre", time: "16:15", stadium: "La Rosaleda", home: "MALAGA CF", away: "ATHLETIC CLUB", finished: false, fh: null, fa: null }
    ];

    window.PALM = [
      {
        title: "Champion en titre",
        holder: "JULEN-03",
        rows: [
          { rank: "1er", name: "LABORDE Julen", detail: "Saison 2025/26" }
        ]
      },
      {
        title: "Coupes de la Peña",
        holder: "LOREA-01",
        rows: [
          { rank: "🏆", name: "LABORDE Lorea", detail: "Coupe d'Hiver" },
          { rank: "🏆", name: "URREIZTIETA Andoni", detail: "Coupe de Printemps" }
        ]
      }
    ];

    let currentUser = null;
    let currentMatchId = "m14";
    let remoteData = { preds: {} };

    function ptsLabel(n) {
      return (n === 0 || n === 1) ? "point" : "pts";
    }

    function cupIcons(code) {
      const count = (code === "LOREA-01") ? 2 : (code === "ANDONI-02" ? 1 : 0);
      if (!count) return "";
      return `<span class="cup-plain">${"🏆".repeat(count)}</span>`;
    }

    function getFirstName(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(/\s+/);
      return parts[parts.length - 1];
    }

    async function loadRemoteData() {
      if (!window.DB_URL) return;
      try {
        const res = await fetch(window.DB_URL + "?t=" + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json && typeof json === "object") {
            remoteData = { preds: json.preds || {} };
          }
        }
      } catch (e) {
        console.warn("Erreur lecture base :", e);
      }
    }

    async function saveRemoteData() {
      if (!window.DB_URL) return;
      try {
        await fetch(window.DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(remoteData)
        });
      } catch (e) {
        console.warn("Erreur sauvegarde base :", e);
      }
    }

    window.setTab = function(tab) {
      const isPronos = (tab === "pronos");
      document.getElementById("view-pronos").classList.toggle("hidden", !isPronos);
      document.getElementById("view-palm").classList.toggle("hidden", isPronos);
      document.getElementById("tab-pronos").classList.toggle("active", isPronos);
      document.getElementById("tab-palm").classList.toggle("active", !isPronos);
      if (!isPronos) renderPalm();
    };

    window.doLogin = async function() {
      const inputEl = document.getElementById("code-in");
      const errEl = document.getElementById("login-err");
      const raw = (inputEl ? inputEl.value : "").trim().toUpperCase();
      if (errEl) errEl.textContent = "";

      if (!raw) {
        if (errEl) errEl.textContent = "Merci de saisir un code.";
        return;
      }

      if (raw === "ADMIN-PENA") {
        currentUser = { code: "ADMIN-PENA", name: "Administrateur Peña", points: 0, isChamp: false, isAdmin: true };
      } else {
        const found = window.MEMBERS.find(m => String(m.code || "").trim().toUpperCase() === raw);
        if (!found) {
          if (errEl) errEl.textContent = `Code "${raw}" non trouvé.`;
          return;
        }
        currentUser = { ...found, isAdmin: false };
      }

      try {
        await loadRemoteData();
      } catch (e) {
        console.warn("Connexion poursuivie sans base distante :", e);
      }

      document.getElementById("sec-login").classList.add("hidden");
      document.getElementById("member-logo").classList.remove("hidden");
      document.getElementById("aupa-banner").classList.remove("hidden");
      document.getElementById("nav").classList.remove("hidden");
      document.getElementById("view-pronos").classList.remove("hidden");

      const firstName = currentUser.isAdmin ? "ADMIN" : getFirstName(currentUser.name).toUpperCase();
      document.getElementById("aupa-heading").textContent = `AUPA ${firstName} !`;
      document.getElementById("aupa-sub").textContent = currentUser.isAdmin
        ? "Mode administrateur actif"
        : `Code : ${currentUser.code}`;
      document.getElementById("aupa-stats").textContent = currentUser.isAdmin
        ? `${window.MEMBERS.length} joueurs`
        : `${currentUser.points} ${ptsLabel(currentUser.points)}`;

      populateMatchSelect();
      window.showMatch(currentMatchId);
      renderLeaderboard();
      renderPalm();
    };

    window.doLogout = function() {
      currentUser = null;
      document.getElementById("code-in").value = "";
      document.getElementById("login-err").textContent = "";
      document.getElementById("sec-login").classList.remove("hidden");
      document.getElementById("member-logo").classList.add("hidden");
      document.getElementById("aupa-banner").classList.add("hidden");
      document.getElementById("nav").classList.add("hidden");
      document.getElementById("view-pronos").classList.add("hidden");
      document.getElementById("view-palm").classList.add("hidden");
    };

    function populateMatchSelect() {
      const sel = document.getElementById("match-select");
      sel.innerHTML = "";
      window.MATCHES.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `Pronostic ${m.num} — ${m.home} vs ${m.away} (${m.date})`;
        sel.appendChild(opt);
      });
      sel.value = currentMatchId;
    }

    window.showMatch = function(matchId) {
      currentMatchId = matchId;
      const m = window.MATCHES.find(x => x.id === matchId) || window.MATCHES[window.MATCHES.length - 1];
      document.getElementById("match-select").value = m.id;
      document.getElementById("th-prono").textContent = `PRONO N° ${m.num}`;
      document.getElementById("pred-ok").textContent = "";

      const titleEl = document.getElementById("match-title");
      const metaEl = document.getElementById("match-meta");
      const predBox = document.getElementById("pred-box");

      if (m.finished) {
        titleEl.textContent = `${m.home} ${m.fh}-${m.fa} ${m.away}`;
        metaEl.textContent = `Pronostic ${m.num} - ${m.comp} - ${m.dayName} ${m.date} - ${m.time} - ${m.stadium} -`;
        predBox.classList.add("hidden");
      } else {
        titleEl.textContent = `Journée ${m.num} - ${m.dayName} ${m.date} ${m.time} - ${m.stadium}`;
        metaEl.textContent = `${m.comp} — Pronostic ouvert`;
        predBox.classList.remove("hidden");
        document.getElementById("lbl-home").textContent = m.home;
        document.getElementById("lbl-away").textContent = m.away;

        const existing = (remoteData.preds && remoteData.preds[m.id] && currentUser)
          ? remoteData.preds[m.id][currentUser.code]
          : null;
        document.getElementById("pred-h").value = existing ? existing.h : "";
        document.getElementById("pred-a").value = existing ? existing.a : "";
      }

      renderLeaderboard();
    };

    window.savePred = async function() {
      const okEl = document.getElementById("pred-ok");
      okEl.textContent = "";
      if (!currentUser || currentUser.isAdmin) {
        okEl.textContent = "Connecte-toi avec un code joueur pour valider un prono.";
        return;
      }

      const hVal = document.getElementById("pred-h").value;
      const aVal = document.getElementById("pred-a").value;
      if (hVal === "" || aVal === "") {
        okEl.textContent = "Merci de saisir les deux scores.";
        return;
      }

      if (!remoteData.preds[currentMatchId]) {
        remoteData.preds[currentMatchId] = {};
      }
      remoteData.preds[currentMatchId][currentUser.code] = {
        h: Number(hVal),
        a: Number(aVal)
      };

      await saveRemoteData();
      okEl.textContent = "Prono enregistré !";
      renderLeaderboard();
    };

    function renderLeaderboard() {
      const tbody = document.getElementById("lb-body");
      const partInfo = document.getElementById("part-info");
      tbody.innerHTML = "";

      const sorted = [...window.MEMBERS].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
      });

      const matchPreds = (remoteData.preds && remoteData.preds[currentMatchId]) || {};
      const submittedCount = Object.keys(matchPreds).length;
      partInfo.textContent = `${submittedCount} / ${sorted.length} pronos enregistrés`;

      sorted.forEach((m, idx) => {
        const prev = idx > 0 ? sorted[idx - 1] : null;
        const showRank = (idx === 0) || (m.points !== prev.points);
        const rankLabel = showRank ? `${idx + 1}` : "";

        const p = matchPreds[m.code];
        const pronoText = (p && p.h !== undefined && p.a !== undefined) ? `${p.h}-${p.a}` : "—";

        const tr = document.createElement("tr");
        if (m.isChamp) tr.classList.add("row-champ");
        if (currentUser && !currentUser.isAdmin && currentUser.code === m.code) tr.classList.add("row-me");

        const badges = [
          m.isChamp ? `<span class="tag tag-champ">Champion</span>` : "",
          (currentUser && !currentUser.isAdmin && currentUser.code === m.code) ? `<span class="tag tag-me">Moi</span>` : "",
          cupIcons(m.code)
        ].join("");

        tr.innerHTML = `
          <td>${rankLabel}</td>
          <td>${m.name}${badges}</td>
          <td class="prono-col">${pronoText}</td>
          <td class="pts-col">${m.points} ${ptsLabel(m.points)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPalm() {
      const grid = document.getElementById("palm-grid");
      grid.innerHTML = "";

      window.PALM.forEach(bloc => {
        const isHolder = currentUser && !currentUser.isAdmin && currentUser.code === bloc.holder;
        const card = document.createElement("div");
        card.className = "palm-card" + (isHolder ? " is-holder" : "");

        const rowsHtml = bloc.rows.map((r, i) => `
          <div class="palm-row ${i === 0 ? "p1" : ""}">
            <span class="palm-rank">${r.rank}</span>
            <span>${r.name}</span>
            <span class="muted" style="margin-left:auto;">${r.detail}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="palm-head">
            <span>${bloc.title}</span>
          </div>
          <div class="palm-rows">${rowsHtml}</div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>

    state.user = Object.assign({}, found, { isAdmin: false });

  }

      `<option value="${m.id}">${m.comp} — ${m.home} vs ${m.away} (${m.finished ? "Terminé" : "À venir"})</option>`
    ).join("");
    ["m-sel", "a-sel"].forEach(id => {
      const sel = byId(id);
      if (sel) {
        sel.innerHTML = opts;
        if (state.matches.some(m => m.id === currentMatchId)) sel.value = currentMatchId;
      }
    });
  }

  function selMatch(id) {
    currentMatchId = id;
    const m = state.matches.find(x => x.id === id) || state.matches[state.matches.length - 1];
    if (!m) return;

    ["m-sel", "a-sel"].forEach(selId => {
      const sel = byId(selId);
      if (sel) sel.value = m.id;
    });

    setText("p-title", `${m.home} vs ${m.away}`);
    setText("p-stat", m.finished ? `Score : ${m.fh} - ${m.fa}` : "Pronostics ouverts");
    setText("p-meta", `${m.comp} • Coup d'envoi : ${String(m.kickoff || "").replace("T", " ")}`);
    setText("t-home", m.home);
    setText("t-away", m.away);
    setText("al-h", m.home);
    setText("al-a", m.away);

    if (m.finished) {
      const fhEl = byId("fh");
      const faEl = byId("fa");
      if (fhEl) fhEl.value = m.fh != null ? m.fh : "";
      if (faEl) faEl.value = m.fa != null ? m.fa : "";
    }

    const formArea = byId("pred-form-area");
    const closedArea = byId("pred-closed-area");
    if (state.user && !state.user.isAdmin && formArea && closedArea) {
      const existing = m.preds && m.preds[state.user.code];
      const inH = byId("in-h");
      const inA = byId("in-a");
      if (inH) inH.value = existing ? existing.h : "";
      if (inA) inA.value = existing ? existing.a : "";
      if (m.finished) {
        formArea.classList.add("hidden");
        closedArea.classList.remove("hidden");
        const prTxt = existing ? `Ton pronostic : ${existing.h} - ${existing.a}` : "Aucun pronostic enregistré";
        closedArea.textContent = `Match terminé (${m.fh} - ${m.fa}) • ${prTxt}.`;
      } else {
        formArea.classList.remove("hidden");
        closedArea.classList.add("hidden");
      }
    }

    renderTrend(m);
    renderAdminWaiting(m);
    renderLeaderboard();
  }

  function goNextOpenMatch() {
    const open = state.matches.find(m => !m.finished);
    if (open) {
      selMatch(open.id);
      setText("fb-msg", `Prochain match ouvert sélectionné : ${open.home} vs ${open.away}.`);
    } else {
      setText("fb-msg", "Aucun match à venir n'est encore ouvert.");
    }
  }

  function renderMemberSummary() {
    if (!state.user || state.user.isAdmin) return;
    const mem = state.members.find(x => x.code === state.user.code);
    const el = byId("m-summary");
    if (mem && el) {
      el.innerHTML = `Total actuel : <strong>${mem.points} pts</strong> ${mem.cups ? "🏆".repeat(mem.cups) : ""} ${mem.isChamp ? '<span class="badge-champ">Tenant du Titre</span>' : ""}`;
    }
  }

  function savePred() {
    if (!state.user || state.user.isAdmin) return;
    const m = state.matches.find(x => x.id === currentMatchId);
    if (!m || m.finished) return;
    const inH = byId("in-h");
    const inA = byId("in-a");
    const h = parseInt(inH ? inH.value : "", 10);
    const a = parseInt(inA ? inA.value : "", 10);
    if (isNaN(h) || isNaN(a) || h < 0 || a < 0) {
      setText("fb-msg", "Merci de saisir deux scores valides.");
      return;
    }
    if (!m.preds) m.preds = {};
    m.preds[state.user.code] = { h, a };
    setText("fb-msg", `Pronostic enregistré (${h} - ${a}) pour ${m.home} vs ${m.away} !`);
    pushToFirebase();
    renderLeaderboard();
  }

  function addMatch() {
    const compTypeEl = byId("n-comp-type");
    const stadeEl = byId("n-stade");
    const homeEl = byId("n-home");
    const awayEl = byId("n-away");
    const kickEl = byId("n-kick");

    const compType = compTypeEl ? compTypeEl.value : "Journée";
    const stade = stadeEl && stadeEl.value ? stadeEl.value.trim() : "";
    const home = homeEl && homeEl.value ? homeEl.value.trim().toUpperCase() : "";
    const away = awayEl && awayEl.value ? awayEl.value.trim().toUpperCase() : "";
    const kick = kickEl && kickEl.value ? kickEl.value : "2026-12-05T21:00";
    if (!home || !away) return;

    const num = state.matches.length + 1;
    const id = "m" + String(num).padStart(2, "0");
    const loc = home.includes("ATHLETIC") ? "Domicile (D)" : "Extérieur (E)";
    state.matches.push({
      id,
      comp: `${compType} • ${loc}${stade ? " • " + stade : ""}`,
      home,
      away,
      kickoff: kick,
      finished: false,
      ptsApplied: false,
      fh: null,
      fa: null,
      preds: {},
      trend: null
    });
    populateMatchSelectors();
    selMatch(id);
    pushToFirebase();
  }

  function calcPts() {
    const m = state.matches.find(x => x.id === currentMatchId);
    if (!m) return;
    const fhEl = byId("fh");
    const faEl = byId("fa");
    const fh = parseInt(fhEl ? fhEl.value : "", 10);
    const fa = parseInt(faEl ? faEl.value : "", 10);
    if (isNaN(fh) || isNaN(fa)) return;
    m.fh = fh;
    m.fa = fa;
    m.finished = true;

    if (!m.ptsApplied) {
      const finalSign = getSign(fh, fa);
      state.members.forEach(mem => {
        const pr = m.preds && m.preds[mem.code];
        if (!pr) return;
        if (pr.h === fh && pr.a === fa) mem.points += 6;
        else if (getSign(pr.h, pr.a) === finalSign) mem.points += 3;
        else mem.points += 1;
      });
      m.ptsApplied = true;
    }
    state.lastUpdate = `${m.home} ${fh} - ${fa} ${m.away} validé`;
    renderMemberSummary();
    renderLeaderboard();
    renderAdminWaiting(m);
    pushToFirebase();
  }

  function saveTrend() {
    const m = state.matches.find(x => x.id === currentMatchId);
    if (!m) return;
    const h = parseInt((byId("tr-h") && byId("tr-h").value) || "0", 10) || 0;
    const d = parseInt((byId("tr-d") && byId("tr-d").value) || "0", 10) || 0;
    const a = parseInt((byId("tr-a") && byId("tr-a").value) || "0", 10) || 0;
    const sc = ((byId("tr-sc") && byId("tr-sc").value) || "").trim() || "1-0";
    const src = ((byId("tr-src") && byId("tr-src").value) || "").trim() || "Tendance Peña";
    m.trend = { h, d, a, sc, src };
    renderTrend(m);
    pushToFirebase();
  }

  function renderTrend(m) {
    const el = byId("trend-display");
    if (!el) return;
    if (!m || !m.trend) {
      el.classList.add("hidden");
      return;
    }
    const { h, d, a, sc, src } = m.trend;
    el.classList.remove("hidden");
    el.innerHTML = `
      <div class="trend-top">
        <span class="trend-title">Tendance du match</span>
        <span class="trend-score-pill">Score favori : ${sc}</span>
      </div>
      <div class="trend-grid">
        <div class="trend-box"><span>Domicile</span><strong>${h}%</strong></div>
        <div class="trend-box"><span>Nul</span><strong>${d}%</strong></div>
        <div class="trend-box"><span>Extérieur</span><strong>${a}%</strong></div>
      </div>
      <div class="trend-bar">
        <div class="trend-bar-h" style="width:${h}%"></div>
        <div class="trend-bar-d" style="width:${d}%"></div>
        <div class="trend-bar-a" style="width:${a}%"></div>
      </div>
      <div class="trend-legend"><span>Dom. ${h}%</span><span>Nul ${d}%</span><span>Ext. ${a}%</span></div>
      <div class="trend-source">${src}</div>
    `;
  }

  function fillFunnyBlogIdea() {
    const t = byId("b-title");
    const b = byId("b-body");
    if (t) t.value = "San Mamés battu sur le fil : Athletic Club 0 - 1 RCD Espanyol";
    if (b) b.value = "Soirée frustrante à San Mamés pour la 13e journée : 20/27 participants (74 %), aucun succès visiteur anticipé, et +1 pt de participation pour les pronostiqueurs présents.";
  }

  function addBlogPost() {
    const t = byId("b-title");
    const b = byId("b-body");
    const title = (t && t.value ? t.value : "").trim();
    const body = (b && b.value ? b.value : "").trim();
    if (!title || !body) return;
    state.blog.unshift({
      id: "b" + Date.now(),
      date: new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }),
      title,
      body
    });
    if (t) t.value = "";
    if (b) b.value = "";
    renderFunAndBlog();
    pushToFirebase();
  }

  function renderAdminWaiting(m) {
    const el = byId("a-track");
    if (!el || !m) return;
    const missing = state.members.filter(mem => !(m.preds && m.preds[mem.code]));
    el.textContent = missing.length
      ? `En attente (${missing.length}/27) : ${missing.map(x => x.name).join(", ")}`
      : "Tous les 27 membres ont pronostiqué.";
  }

  function renderAdminCodes() {
    const el = byId("a-codes");
    if (!el) return;
    el.innerHTML = MEMBERS.map(m => `<div><strong>${m.code}</strong> — ${m.name}</div>`).join("");
  }

  function copyRecap() {
    const m = state.matches.find(x => x.id === currentMatchId);
    if (!m) return;
    const txt = `${m.home} ${m.finished ? m.fh : "?"} - ${m.finished ? m.fa : "?"} ${m.away} (${m.comp})`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(() => {});
    }
    setText("copy-fb", "Récapitulatif copié !");
  }

  function renderLeaderboard() {
    const m = state.matches.find(x => x.id === currentMatchId) || state.matches[state.matches.length - 1];
    const lb = byId("lb");
    if (!lb || !m) return;

    const predCount = m.preds ? Object.keys(m.preds).length : 0;
    const pct = Math.round((predCount / state.members.length) * 100);
    setText("participation-display", `Taux de participation pour ${m.comp} : ${pct}% (${predCount}/${state.members.length} participants)`);
    setText("last-update", state.lastUpdate ? `Dernière mise à jour : ${state.lastUpdate}` : "");

    const canReveal = m.finished || (state.user && state.user.isAdmin);
    setText("vis-msg", canReveal ? "Pronostics révélés." : "Les pronostics des autres membres sont masqués jusqu'à la fin du match.");

    const sorted = [...state.members].sort((a, b) => (b.points || 0) - (a.points || 0) || a.name.localeCompare(b.name));
    let currentRank = 1;
    lb.innerHTML = sorted.map((mem, idx) => {
      if (idx > 0 && (mem.points || 0) < (sorted[idx - 1].points || 0)) {
        currentRank = idx + 1;
      }
      const medal = currentRank === 1 ? "🥇 " : currentRank === 2 ? "🥈 " : currentRank === 3 ? "🥉 " : "";
      const pr = m.preds && m.preds[mem.code];
      let prText = "-";
      if (pr) {
        if (state.user && (state.user.isAdmin || state.user.code === mem.code || canReveal)) {
          prText = `${pr.h} - ${pr.a}`;
        } else {
          prText = "✓";
        }
      }
      let ptsGain = "";
      if (m.finished) {
        if (!pr) ptsGain = " (+0 pt)";
        else if (pr.h === m.fh && pr.a === m.fa) ptsGain = " (+6 pts)";
        else if (getSign(pr.h, pr.a) === getSign(m.fh, m.fa)) ptsGain = " (+3 pts)";
        else ptsGain = " (+1 pt)";
      }
      const isMe = state.user && !state.user.isAdmin && state.user.code === mem.code;
      const rowClass = mem.isChamp ? "champ" : (isMe ? "me-row" : "");
      const cups = mem.cups ? " " + "🏆".repeat(mem.cups) : "";
      const champBadge = mem.isChamp ? '<span class="badge-champ">Tenant du Titre</span>' : "";
      const meBadge = isMe ? '<span class="badge-me">Moi</span>' : "";
      return `<tr class="${rowClass}">
        <td>${currentRank}</td>
        <td>${medal}<strong>${mem.name}</strong>${cups}${champBadge}${meBadge}</td>
        <td>${prText}<span class="pts-gain">${ptsGain}</span></td>
        <td><strong>${mem.points || 0} pts</strong></td>
      </tr>`;
    }).join("");
  }

  function renderFunAndBlog() {
    const cardsEl = byId("fun-cards");
    const exactEl = byId("exact-lb");
    const blogEl = byId("blog-list");

    if (cardsEl) {
      cardsEl.innerHTML = `
        <div class="fun-box">
          <div class="fun-label">Reine / Roi du Score Exact (+6 pts)</div>
          <div class="fun-winner">Aucun score exact sur J13</div>
          <div class="fun-sub">Le score 0 - 1 n'a été trouvé par aucun membre lors de cette journée.</div>
        </div>
        <div class="fun-box">
          <div class="fun-label">Série en cours</div>
          <div class="fun-winner">LABORDE Lorea (36 pts)</div>
          <div class="fun-sub">Devant URREIZTIETA Andoni (35 pts) et LABORDE Julen (29 pts).</div>
        </div>
        <div class="fun-box">
          <div class="fun-label">Spécialiste du nul</div>
          <div class="fun-winner">CURUTCHARRY Pierre</div>
          <div class="fun-sub">Seul membre à avoir tenté un match nul (1 - 1) sur cette 13e journée.</div>
        </div>
        <div class="fun-box">
          <div class="fun-label">Aventurier extérieur</div>
          <div class="fun-winner">À suivre à Málaga (E)</div>
          <div class="fun-sub">La victoire de l'Espanyol à San Mamés a surpris tout le monde : qui osera miser sur l'extérieur ?</div>
        </div>
      `;
    }

    if (exactEl) {
      const topExact = [...state.members].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 5);
      exactEl.innerHTML = topExact.map((mem, i) => `<tr><td>${i + 1}</td><td>${mem.name}</td><td>0</td><td>J13 sans score exact</td></tr>`).join("");
    }

    if (blogEl) {
      blogEl.innerHTML = state.blog.map(post => `
        <div class="blog-post">
          <div class="blog-meta">${post.date}</div>
          <h3 class="blog-title">${post.title}</h3>
          <div class="blog-body">${post.body}</div>
        </div>
      `).join("");
    }
  }

  function renderPalmares() {
    const el = byId("palm-list");
    if (!el) return;
    el.innerHTML = PALM.map(p => `
      <div class="palmares-item">
        <div style="font-weight:800; color:#FF5A54;">${p.y}</div>
        <div>🥇 <strong>${p.p1}</strong></div>
        <div>🥈 ${p.p2}</div>
        <div>🥉 ${p.p3}</div>
      </div>
    `).join("");
  }

  function pushToFirebase() {
    setSync("🟡 Sync...");
    fetch(DB, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        matches: state.matches,
        members: state.members,
        blog: state.blog,
        lastUpdate: state.lastUpdate
      })
    })
      .then(() => setSync("🟢 Synchronisé"))
      .catch(() => setSync("🟠 Hors ligne (local)"));
  }

  function forcePushSync() {
    pushToFirebase();
  }

  function loadFromFirebase(silent) {
    if (!silent) setSync("🟡 Chargement...");
    fetch(DB)
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        if (data && Array.isArray(data.matches) && data.matches.length > 0) {
          state.matches = data.matches.map(m => {
            const hist = HISTORIQUE_MATCHS.find(h => h.id === m.id);
            return Object.assign({}, hist || {}, m, {
              preds: (m.preds && Object.keys(m.preds).length > 0) ? m.preds : (hist ? hist.preds : {}),
              ptsApplied: typeof m.ptsApplied === "boolean" ? m.ptsApplied : Boolean(m.finished)
            });
          });
        }
        if (data && Array.isArray(data.members) && data.members.length > 0) {
          state.members = MEMBERS.map(base => {
            const remote = data.members.find(r => r.code === base.code);
            const pts = typeof base.points === "number" ? base.points : (remote && typeof remote.points === "number" ? remote.points : 0);
            return Object.assign({}, base, remote || {}, { points: pts });
          });
        }
        if (data && Array.isArray(data.blog) && data.blog.length > 0) {
          state.blog = data.blog;
        }
        if (data && data.lastUpdate) {
          state.lastUpdate = data.lastUpdate;
        }
        populateMatchSelectors();
        selMatch(currentMatchId);
        renderMemberSummary();
        renderLeaderboard();
        renderFunAndBlog();
        setSync("🟢 Synchronisé");
      })
      .catch(() => setSync("🟢 Prêt (local)"));
  }

  window.tab = tab;
  window.login = login;
  window.logout = logout;
  window.selMatch = selMatch;
  window.goNextOpenMatch = goNextOpenMatch;
  window.savePred = savePred;
  window.addMatch = addMatch;
  window.calcPts = calcPts;
  window.saveTrend = saveTrend;
  window.fillFunnyBlogIdea = fillFunnyBlogIdea;
  window.addBlogPost = addBlogPost;
  window.copyRecap = copyRecap;
  window.forcePushSync = forcePushSync;

  populateMatchSelectors();
  selMatch(currentMatchId);
  renderPalmares();
  renderLeaderboard();
})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --border: #e2e6ec;
      --text: #161b22;
      --muted: #57606a;
      --accent: #cf222e;
      --accent-2: #1a7f37;
      --gold: #9a6700;
      --gold-bg: #fff8c5;
      --champ-bg: #e8f7ee;
      --palm-red-bg: #fde8ea;
      --palm-red-border: #f3b4ba;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
    }
    .logo-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text);
    }
    .logo-sub {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo-right {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sync-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    button, select, input {
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.92rem;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .match-title { font-size: 1.2rem; font-weight: 800; }
    .pill {
      background: var(--gold-bg);
      border: 1px solid #d4a72c;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 700;
    }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .err { color: #cf222e; font-size: 0.88rem; margin-top: 8px; font-weight: 600; }
    .ok { color: var(--accent-2); font-size: 0.88rem; margin-top: 8px; font-weight: 600; }
    .hidden { display: none !important; }
    .score-inputs { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .score-inputs input { width: 72px; text-align: center; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    th.prono-col, td.prono-col {
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
    }
    td.pts-col { font-weight: 700; }
    tr.champ td { background: var(--champ-bg); }
    tr.champ td.prono-col { background: #111111; color: #ffffff; }
    tr.me-row td { background: #fff5f5; }
    tr.me-row td.prono-col { background: #111111; color: #ffffff; }
    .champ-tag { font-style: italic; color: var(--accent-2); margin-left: 6px; }

    .palmares-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .palm-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .palm-season {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .palm-season span {
      font-size: 0.75rem;
      font-style: italic;
      color: var(--accent-2);
      font-weight: 700;
    }
    .palm-rows {
      padding: 10px 14px;
      display: grid;
      gap: 6px;
    }
    .palm-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 0.88rem;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid #eef1f4;
      background: #ffffff;
    }
    .palm-row.p1 {
      background: var(--palm-red-bg);
      border-color: var(--palm-red-border);
      font-weight: 700;
      color: var(--text);
    }
    .palm-rank {
      flex: 0 0 auto;
      font-weight: 800;
      min-width: 34px;
    }
    .palm-name { flex: 1 1 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 class="logo-title">IPARRALDEKO PEÑA</h1>
        <div class="logo-sub">EUSKAL HERRIA</div>
      </div>
      <div class="logo-right">ATHLETIC CLUB</div>
      <div class="top-actions">
        <span id="sync" class="sync-pill">Prêt</span>
        <div id="nav" class="nav hidden">
          <button id="t-pronos" class="active" type="button">Pronos & Classement</button>
          <button id="t-palm" type="button">Palmarès</button>
          <button id="logout-btn" type="button">Déconnexion</button>
        </div>
      </div>
    </header>

    <section id="login-sec" class="card">
      <h2 style="margin-top:0;">Connexion membre ou administrateur</h2>
      <p class="muted">Entre ton code membre (ex. ALAIN-08) ou ADMIN-PENA.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="code-in" type="text" placeholder="Code d'accès" />
        <button id="login-btn" class="primary" type="button">Se connecter</button>
      </div>
      <div id="err" class="err"></div>
    </section>

    <section id="mem-sec" class="card hidden">
      <strong>Connecté :</strong> <span id="m-name"></span>
      <div id="m-summary" class="muted" style="margin-top:4px;"></div>
    </section>

    <section id="adm-sec" class="card hidden">
      <h2 style="margin-top:0;">Administration Peña</h2>
      <select id="a-sel" style="width:100%; margin-bottom:10px;"></select>
      <div class="score-inputs">
        <span id="al-h">DOM</span>
        <input id="fh" type="number" min="0" placeholder="0" />
        <span>-</span>
        <input id="fa" type="number" min="0" placeholder="0" />
        <span id="al-a">EXT</span>
        <button id="calc-btn" class="primary" type="button">Valider score</button>
      </div>
      <div id="adm-msg" class="ok"></div>
    </section>

    <main id="v-pronos" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
          <label for="m-sel" class="muted">Match sélectionné :</label>
          <select id="m-sel" style="flex:1; min-width:240px;"></select>
        </div>
        <div class="match-head">
          <div>
            <div id="p-title" class="match-title"></div>
            <div id="p-meta" class="muted"></div>
          </div>
          <span id="p-stat" class="pill"></span>
        </div>
        <div id="pred-form-area" class="hidden">
          <div class="score-inputs">
            <span id="t-home">DOM</span>
            <input id="in-h" type="number" min="0" placeholder="0" />
            <span>-</span>
            <input id="in-a" type="number" min="0" placeholder="0" />
            <span id="t-away">EXT</span>
            <button id="save-pred-btn" class="primary" type="button">Valider mon prono</button>
          </div>
          <div id="fb-msg" class="ok"></div>
        </div>
        <div id="pred-closed-area" class="muted" style="margin-top:8px;"></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0;">Classement général</h2>
        <div id="participation-display" class="muted"></div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Joueur</th>
                <th id="th-prono" class="prono-col">PRONO N° 13</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="lb"></tbody>
          </table>
        </div>
      </div>
    </main>

    <section id="v-palm" class="hidden">
      <div class="card">
        <div class="match-head">
          <h2 style="margin:0;">Palmarès de la Peña</h2>
          <span class="muted">1er, 2e et 3e par saison</span>
        </div>
        <div id="palm-list" class="palmares-grid"></div>
      </div>
    </section>
  </div>

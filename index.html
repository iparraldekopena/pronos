<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg-page: #f6f7f9;
      --bg-card: #ffffff;
      --bg-white: #ffffff;
      --text-main: #14181f;
      --text-muted: #5b6575;
      --border: #e3e7ee;
      --accent: #c81d25;
      --accent-soft: #fde8ea;
      --accent-border: #f3b4ba;
      --green-soft: #e6f6ec;
      --green-text: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .top-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .top-meta {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-club {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logo-banner {
      background: var(--accent);
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(200, 29, 37, 0.25);
    }

    .logo-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .logo-sub {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffe5e7;
      margin-top: 2px;
    }

    .aupa-banner {
      width: 100%;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .aupa-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
    }

    .hidden { display: none !important; }

    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cfd6e0;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--text-main);
    }

    button { cursor: pointer; font-weight: 700; }
    button.primary, button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .err { color: var(--accent); font-weight: 700; margin-top: 8px; }
    .ok { color: var(--green-text); font-weight: 700; margin-top: 8px; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-white);
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      background: var(--bg-white);
      color: var(--text-main);
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th.prono-col, td.prono-col {
      background: var(--bg-white);
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      border-left: 1px solid #edf0f5;
      border-right: 1px solid #edf0f5;
    }

    td.pts-col { font-weight: 800; text-align: right; }

    tr.row-champ td, tr.row-champ td.prono-col { background: var(--accent-soft); }
    tr.row-me td, tr.row-me td.prono-col { background: var(--green-soft); }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .tag-champ { background: #fbd2d7; color: #8f131b; }
    .tag-me { background: #c7ebd4; color: var(--green-text); }

    .palm-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cup-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .palm-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-white);
    }

    .palm-card.is-holder {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .palm-head {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }

    .palm-card.is-holder .palm-head {
      background: var(--accent-soft);
      border-bottom-color: var(--accent-border);
    }

    .palm-rows { padding: 12px 14px; display: grid; gap: 7px; }

    .palm-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #eef1f5;
      background: #ffffff;
      font-size: 0.9rem;
    }

    .palm-row.p1 {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      font-weight: 800;
    }

    .palm-rank { font-weight: 800; min-width: 34px; }
  </style>
</head>

        <button id="btn-logout" type="button" onclick="doLogout()">Déconnexion</button>
      </nav>
    </header>

    <section id="sec-login" class="card">
      <h2 style="margin-top:0;">Connexion à l'espace membre</h2>
      <p class="muted">Saisis ton code joueur (ex. <strong>ALAIN-08</strong>) ou <strong>ADMIN-PENA</strong>.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="code-in" type="text" placeholder="Ex. ALAIN-08" autocomplete="off" onkeydown="if(event.key==='Enter'||event.keyCode===13) doLogin();" />
        <button id="btn-login" class="primary" type="button" onclick="doLogin()">Se connecter</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <div class="card">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <label for="match-select" class="muted" style="font-weight:700;">Choisir une journée :</label>
          <select id="match-select" onchange="showMatch(this.value)"></select>
        </div>
        <h3 id="match-title" style="margin:0 0 4px;"></h3>
        <div id="match-meta" class="muted"></div>

        <div id="pred-box" class="hidden" style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span id="lbl-home" style="font-weight:700;"></span>
          <input id="pred-h" type="number" min="0" style="width:72px; text-align:center;" />
          <span>-</span>
          <input id="pred-a" type="number" min="0" style="width:72px; text-align:center;" />
          <span id="lbl-away" style="font-weight:700;"></span>
          <button id="btn-save-pred" class="primary" type="button" onclick="savePred()">Valider prono</button>
        </div>
        <div id="pred-ok" class="ok"></div>
      </div>

      <div class="card">
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px;">
          <h2 style="margin:0;">Classement général</h2>
          <div id="part-info" class="muted"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Joueur</th>
                <th id="th-prono" class="prono-col">PRONO N° 13</th>
                <th style="text-align:right;">Total</th>
              </tr>
            </thead>
            <tbody id="lb-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <section id="view-palm" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Palmarès de la Peña</h2>
        <div id="palm-summary" class="palm-summary"></div>
        <div id="palm-grid" class="palm-grid"></div>
      </div>
    </section>
  </div>

    function byId(id) { return document.getElementById(id); }
    function setText(id, txt) { var n = byId(id); if (n) n.textContent = txt; }
    function getSign(h, a) { return h > a ? "1" : (h < a ? "2" : "N"); }

    function getFirstName(fullName) {
      if (!fullName) return "MEMBRE";
      var parts = fullName.trim().split(/\s+/);
      return (parts[parts.length - 1] || fullName).toUpperCase();
    }

    function normalizeKey(label) {
      return (label || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function computeCupCounts() {
      var counts = {};
      var order = [];
      for (var i = 0; i < PALM.length; i++) {
        var rawWinners = PALM[i].p1.split(/\s+ET\s+/i);
        for (var j = 0; j < rawWinners.length; j++) {
          var clean = rawWinners[j].trim();
          if (!clean) continue;
          var key = normalizeKey(clean);
          if (!counts[key]) {
            counts[key] = { label: clean, count: 0 };
            order.push(key);
          }
          counts[key].count += 1;
        }
      }
      return { counts: counts, order: order };
    }

    function getMatchById(id) {
      for (var i = 0; i < MATCHES.length; i++) {
        if (MATCHES[i].id === id) return MATCHES[i];
      }
      return MATCHES[MATCHES.length - 1];
    }

    function renderPalmares() {
      var grid = byId("palm-grid");
      var summary = byId("palm-summary");
      grid.innerHTML = "";
      summary.innerHTML = "";

      var cupData = computeCupCounts();
      for (var k = 0; k < cupData.order.length; k++) {
        var item = cupData.counts[cupData.order[k]];
        var pill = document.createElement("div");
        pill.className = "cup-pill";
        pill.textContent = "🏆 " + item.label + " : " + item.count + (item.count > 1 ? " coupes" : " coupe");
        summary.appendChild(pill);
      }

      for (var i = 0; i < PALM.length; i++) {
        var s = PALM[i];
        var card = document.createElement("div");
        card.className = "palm-card" + (s.isHolder ? " is-holder" : "");

        var head = document.createElement("div");
        head.className = "palm-head";
        head.textContent = "Saison " + s.y;
        if (s.isHolder) {
          var spanH = document.createElement("span");
          spanH.className = "tag tag-champ";
          spanH.textContent = "Tenant du titre";
          head.appendChild(spanH);
        }

        var rows = document.createElement("div");
        rows.className = "palm-rows";
        var lines = [
          { cls: "palm-row p1", rank: "1er", name: "🏆 " + s.p1 },
          { cls: "palm-row", rank: "2e", name: s.p2 },
          { cls: "palm-row", rank: "3e", name: s.p3 }
        ];

        for (var j = 0; j < lines.length; j++) {
          var row = document.createElement("div");
          row.className = lines[j].cls;

          var rk = document.createElement("span");
          rk.className = "palm-rank";
          rk.textContent = lines[j].rank;

          var nm = document.createElement("span");
          nm.textContent = lines[j].name;

          row.appendChild(rk);
          row.appendChild(nm);
          rows.appendChild(row);
        }

        card.appendChild(head);
        card.appendChild(rows);
        grid.appendChild(card);
      }
    }

    function renderLeaderboard(m) {
      var n = parseInt(m.pronoNum, 10) || 1;
      setText("th-prono", "PRONO N° " + (n < 10 ? "0" + n : String(n)));

      var cnt = 0;
      for (var k in m.preds) {
        if (m.preds.hasOwnProperty(k)) cnt++;
      }
      setText("part-info", "Participation : " + cnt + " / " + MEMBERS.length + " joueurs");

      var sorted = MEMBERS.slice().sort(function (a, b) {
        return (b.points || 0) - (a.points || 0) || a.name.localeCompare(b.name);
      });

      var tb = byId("lb-body");
      tb.innerHTML = "";

      for (var i = 0; i < sorted.length; i++) {
        var mem = sorted[i];
        var pr = m.preds[mem.code];
        var txt = pr ? (pr.h + " - " + pr.a) : "-";

        if (m.finished) {
          if (!pr) txt += " (+0 pt)";
          else if (pr.h === m.fh && pr.a === m.fa) txt += " (+6 pts)";
          else if (getSign(pr.h, pr.a) === getSign(m.fh, m.fa)) txt += " (+3 pts)";
          else txt += " (+1 pt)";
        }

        var isMe = Boolean(state.user && !state.user.isAdmin && state.user.code === mem.code);
        var tr = document.createElement("tr");
        if (isMe) tr.className = "row-me";
        else if (mem.isChamp) tr.className = "row-champ";

        var td1 = document.createElement("td");
        td1.textContent = String(i + 1);

        var td2 = document.createElement("td");
        td2.style.fontWeight = (isMe || mem.isChamp) ? "800" : "600";
        td2.appendChild(document.createTextNode(mem.name));

        if (mem.isChamp) {
          var emC = document.createElement("span");
          emC.className = "tag tag-champ";
          emC.textContent = "Tenant du titre";
          td2.appendChild(emC);
        }

        if (isMe) {
          var emM = document.createElement("span");
          emM.className = "tag tag-me";
          emM.textContent = "Toi";
          td2.appendChild(emM);
        }

        var td3 = document.createElement("td");
        td3.className = "prono-col";
        td3.textContent = txt;

        var td4 = document.createElement("td");
        td4.className = "pts-col";
        td4.textContent = mem.points + " pts";

        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        tb.appendChild(tr);
      }
    }

      setText("lbl-home", m.home);
      setText("lbl-away", m.away);
      setText("pred-ok", "");

      if (!m.finished && state.user && !state.user.isAdmin) {
        byId("pred-box").classList.remove("hidden");
        var pr = m.preds[state.user.code];
        byId("pred-h").value = pr ? pr.h : "";
        byId("pred-a").value = pr ? pr.a : "";
      } else {
        byId("pred-box").classList.add("hidden");
      }

      renderLeaderboard(m);
    }

      var raw = (byId("code-in").value || "").replace(/^\s+|\s+$/g, "").toUpperCase();
      if (!raw) {
        setText("login-err", "Merci d'entrer un code d'accès.");
        return;
      }
      if (raw === "ADMIN-PENA") {
        setText("login-err", "");
        startSession({ code: "ADMIN-PENA", name: "Administrateur", points: 0, isAdmin: true });
        return;
      }
      for (var i = 0; i < MEMBERS.length; i++) {
        if (MEMBERS[i].code === raw) {
          setText("login-err", "");
          startSession({
            code: MEMBERS[i].code,
            name: MEMBERS[i].name,
            points: MEMBERS[i].points,
            isAdmin: false
          });
          return;
        }
      }
      setText("login-err", "Code inconnu (" + raw + ").");
    }

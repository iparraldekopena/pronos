<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg-page: #f6f7f9;
      --bg-card: #ffffff;
      --bg-white: #ffffff;
      --text-main: #14181f;
      --text-muted: #5b6575;
      --border: #e3e7ee;
      --accent: #c81d25;
      --accent-soft: #fde8ea;
      --accent-border: #f3b4ba;
      --green-soft: #e6f6ec;
      --green-text: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .top-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .top-meta {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-club {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .logo-img {
      max-width: 100%;
      width: 680px;
      height: auto;
      border-radius: 10px;
      display: block;
      box-shadow: 0 4px 14px rgba(20, 24, 31, 0.08);
    }

    .aupa-banner {
      width: 100%;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .aupa-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
    }

    .hidden { display: none !important; }

    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cfd6e0;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--text-main);
    }

    button { cursor: pointer; font-weight: 700; }
    button.primary, button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .err { color: var(--accent); font-weight: 700; margin-top: 8px; }
    .ok { color: var(--green-text); font-weight: 700; margin-top: 8px; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-white);
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      background: var(--bg-white);
      color: var(--text-main);
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th.prono-col, td.prono-col {
      background: var(--bg-white);
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      border-left: 1px solid #edf0f5;
      border-right: 1px solid #edf0f5;
    }

    td.pts-col { font-weight: 800; text-align: right; }

    tr.row-champ td, tr.row-champ td.prono-col { background: var(--accent-soft); }
    tr.row-me td, tr.row-me td.prono-col { background: var(--green-soft); }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .tag-champ { background: #fbd2d7; color: #8f131b; }
    .tag-me { background: #c7ebd4; color: var(--green-text); }

    #view-palm .card {
      background: #0d1016;
      border-color: #262d3d;
      color: #f3f5f8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    #view-palm h2 { color: #ffffff; }

    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .palm-card {
      border: 1px solid #272e3f;
      border-radius: 12px;
      overflow: hidden;
      background: #161b24;
      color: #f3f5f8;
    }

    .palm-card.is-holder {
      background: #281317;
      border-color: #9e222b;
    }

    .palm-head {
      padding: 11px 14px;
      border-bottom: 1px solid #272e3f;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1d2330;
      color: #ffffff;
    }

    .palm-card.is-holder .palm-head {
      background: #36161c;
      border-bottom-color: #9e222b;
    }

    .palm-rows { padding: 12px 14px; display: grid; gap: 7px; }

    .palm-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #262e3e;
      background: #11151d;
      color: #e5e9f0;
      font-size: 0.9rem;
    }

    .palm-row.p1 {
      background: #421820;
      border-color: #b52731;
      color: #ffffff;
      font-weight: 800;
    }

    .palm-rank { font-weight: 800; min-width: 34px; color: #f87171; }
    .palm-row:not(.p1) .palm-rank { color: #9aa5b8; }
  </style>
</head>

  <div class="wrap">

        <button id="btn-logout" type="button" onclick="window.doLogout()">Déconnexion</button>
      </nav>
    </header>

    <section id="sec-login" class="card">
      <h2 style="margin-top:0;">Connexion à l'espace membre</h2>
      <p class="muted">Saisis ton code joueur (ex. <strong>ALAIN-08</strong>) ou <strong>ADMIN-PENA</strong>.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="code-in" type="text" placeholder="Ex. ALAIN-08" autocomplete="off" onkeydown="if(event.key==='Enter'||event.keyCode===13) window.doLogin();" />
        <button id="btn-login" class="primary" type="button" onclick="window.doLogin()">Se connecter</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <div class="card">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <label for="match-select" class="muted" style="font-weight:700;">Choisir une journée :</label>
          <select id="match-select" onchange="window.showMatch(this.value)"></select>
        </div>
        <h3 id="match-title" style="margin:0 0 4px;"></h3>
        <div id="match-meta" class="muted"></div>

        <div id="pred-box" class="hidden" style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span id="lbl-home" style="font-weight:700;"></span>
          <input id="pred-h" type="number" min="0" style="width:72px; text-align:center;" />
          <span>-</span>
          <input id="pred-a" type="number" min="0" style="width:72px; text-align:center;" />
          <span id="lbl-away" style="font-weight:700;"></span>
          <button id="btn-save-pred" class="primary" type="button" onclick="window.savePred()">Valider prono</button>
        </div>
        <div id="pred-ok" class="ok"></div>
      </div>

      <div class="card">
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px;">
          <h2 style="margin:0;">Classement général</h2>
          <div id="part-info" class="muted"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Joueur</th>
                <th id="th-prono" class="prono-col">PRONO N° 13</th>
                <th style="text-align:right;">Total</th>
              </tr>
            </thead>
            <tbody id="lb-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <section id="view-palm" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Palmarès de la Peña</h2>
        <div id="palm-grid" class="palm-grid"></div>
      </div>
    </section>
  </div>

    var appState = { user: null, currentId: "m13" };

    function el(id) { return document.getElementById(id); }
    function setTxt(id, txt) { var n = el(id); if (n) n.textContent = txt; }
    function sign(h, a) { return h > a ? "1" : (h < a ? "2" : "N"); }

    function firstName(fullName) {
      if (!fullName) return "MEMBRE";
      var parts = fullName.trim().split(/\s+/);
      return (parts[parts.length - 1] || fullName).toUpperCase();
    }

    function findMatch(id) {
      for (var i = 0; i < window.MATCHES.length; i++) {
        if (window.MATCHES[i].id === id) return window.MATCHES[i];
      }
      return window.MATCHES[window.MATCHES.length - 1];
    }

    function renderPalmares() {
      var grid = el("palm-grid");
      grid.innerHTML = "";

      for (var i = 0; i < window.PALM.length; i++) {
        var s = window.PALM[i];
        var card = document.createElement("div");
        card.className = "palm-card" + (s.isHolder ? " is-holder" : "");

        var head = document.createElement("div");
        head.className = "palm-head";
        head.textContent = "Saison " + s.y;
        if (s.isHolder) {
          var sp = document.createElement("span");
          sp.className = "tag tag-champ";
          sp.textContent = "Tenant du titre";
          head.appendChild(sp);
        }

        var rows = document.createElement("div");
        rows.className = "palm-rows";
        var lines = [
          { cls: "palm-row p1", rank: "1er", name: "🏆 " + s.p1 },
          { cls: "palm-row", rank: "2e", name: s.p2 },
          { cls: "palm-row", rank: "3e", name: s.p3 }
        ];

        for (var j = 0; j < lines.length; j++) {
          var row = document.createElement("div");
          row.className = lines[j].cls;
          var rk = document.createElement("span");
          rk.className = "palm-rank";
          rk.textContent = lines[j].rank;
          var nm = document.createElement("span");
          nm.textContent = lines[j].name;
          row.appendChild(rk);
          row.appendChild(nm);
          rows.appendChild(row);
        }

        card.appendChild(head);
        card.appendChild(rows);
        grid.appendChild(card);
      }
    }

    function renderLeaderboard(m) {
      var n = parseInt(m.pronoNum, 10) || 1;
      setTxt("th-prono", "PRONO N° " + (n < 10 ? "0" + n : String(n)));

      var cnt = 0;
      for (var k in m.preds) {
        if (Object.prototype.hasOwnProperty.call(m.preds, k)) cnt++;
      }
      setTxt("part-info", "Participation : " + cnt + " / " + window.MEMBERS.length + " joueurs");

      var sorted = window.MEMBERS.slice().sort(function (a, b) {
        return (b.points || 0) - (a.points || 0) || a.name.localeCompare(b.name);
      });

      var tb = el("lb-body");
      tb.innerHTML = "";

      for (var i = 0; i < sorted.length; i++) {
        var mem = sorted[i];
        var pr = m.preds[mem.code];
        var txt = pr ? (pr.h + " - " + pr.a) : "-";

        if (m.finished) {
          if (!pr) txt += " (+0 pt)";
          else if (pr.h === m.fh && pr.a === m.fa) txt += " (+6 pts)";
          else if (sign(pr.h, pr.a) === sign(m.fh, m.fa)) txt += " (+3 pts)";
          else txt += " (+1 pt)";
        }

        var isMe = Boolean(appState.user && !appState.user.isAdmin && appState.user.code === mem.code);
        var tr = document.createElement("tr");
        if (isMe) tr.className = "row-me";
        else if (mem.isChamp) tr.className = "row-champ";

        var td1 = document.createElement("td");
        td1.textContent = String(i + 1);

        var td2 = document.createElement("td");
        td2.style.fontWeight = (isMe || mem.isChamp) ? "800" : "600";
        td2.appendChild(document.createTextNode(mem.name));

        if (mem.isChamp) {
          var emC = document.createElement("span");
          emC.className = "tag tag-champ";
          emC.textContent = "Tenant du titre";
          td2.appendChild(emC);
        }

        if (isMe) {
          var emM = document.createElement("span");
          emM.className = "tag tag-me";
          emM.textContent = "Toi";
          td2.appendChild(emM);
        }

        var td3 = document.createElement("td");
        td3.className = "prono-col";
        td3.textContent = txt;

        var td4 = document.createElement("td");
        td4.className = "pts-col";
        td4.textContent = mem.points + " pts";

        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        tb.appendChild(tr);
      }
    }

    window.showMatch = function (id) {
      appState.currentId = id;
      var m = findMatch(id);
      el("match-select").value = m.id;
      setTxt("match-title", m.home + " vs " + m.away);
      setTxt("match-meta", m.comp + " • " + m.kickoff + (m.finished ? (" • Score final : " + m.fh + " - " + m.fa) : " • Pronostics ouverts"));
      setTxt("lbl-home", m.home);
      setTxt("lbl-away", m.away);
      setTxt("pred-ok", "");

      if (!m.finished && appState.user && !appState.user.isAdmin) {
        el("pred-box").classList.remove("hidden");
        var pr = m.preds[appState.user.code];
        el("pred-h").value = pr ? pr.h : "";
        el("pred-a").value = pr ? pr.a : "";
      } else {
        el("pred-box").classList.add("hidden");
      }

      renderLeaderboard(m);
    };

    function fillMatchSelect() {
      var sel = el("match-select");
      sel.innerHTML = "";
      for (var i = 0; i < window.MATCHES.length; i++) {
        var opt = document.createElement("option");
        opt.value = window.MATCHES[i].id;
        opt.textContent = window.MATCHES[i].comp + " — " + window.MATCHES[i].home + " vs " + window.MATCHES[i].away;
        sel.appendChild(opt);
      }
    }

    window.setTab = function (name) {
      if (!appState.user) return;
      var isPalm = name === "palm";
      el("view-pronos").classList.toggle("hidden", isPalm);
      el("view-palm").classList.toggle("hidden", !isPalm);
      el("tab-pronos").classList.toggle("active", !isPalm);
      el("tab-palm").classList.toggle("active", isPalm);
      if (isPalm) renderPalmares();
    };

    function openSession(u) {
      appState.user = u;
      el("sec-login").classList.add("hidden");
      el("member-logo").classList.remove("hidden");
      el("nav").classList.remove("hidden");
      el("aupa-banner").classList.remove("hidden");

      var greet = u.isAdmin ? "AUPA ADMIN" : ("AUPA " + firstName(u.name));
      setTxt("aupa-heading", greet + " !");
      setTxt("aupa-sub", "Bienvenue dans l'espace des pronostics • " + u.name);
      setTxt("aupa-stats", u.isAdmin ? "Mode administrateur" : ("Total actuel : " + u.points + " pts"));

      fillMatchSelect();
      window.showMatch(appState.currentId);
      window.setTab("pronos");
    }

    window.doLogin = function () {
      var inp = el("code-in");
      var raw = (inp && inp.value ? inp.value : "").replace(/^\s+|\s+$/g, "").toUpperCase();
      if (!raw) {
        setTxt("login-err", "Merci d'entrer un code d'accès.");
        return;
      }
      if (raw === "ADMIN-PENA") {
        setTxt("login-err", "");
        openSession({ code: "ADMIN-PENA", name: "Administrateur", points: 0, isAdmin: true });
        return;
      }
      for (var i = 0; i < window.MEMBERS.length; i++) {
        if (window.MEMBERS[i].code === raw) {
          setTxt("login-err", "");
          openSession({
            code: window.MEMBERS[i].code,
            name: window.MEMBERS[i].name,
            points: window.MEMBERS[i].points,
            isAdmin: false
          });
          return;
        }
      }
      setTxt("login-err", "Code inconnu (" + raw + ").");
    };

    window.doLogout = function () {
      appState.user = null;
      el("member-logo").classList.add("hidden");
      el("nav").classList.add("hidden");
      el("aupa-banner").classList.add("hidden");
      el("view-pronos").classList.add("hidden");
      el("view-palm").classList.add("hidden");
      el("sec-login").classList.remove("hidden");
      if (el("code-in")) el("code-in").value = "";
    };

    window.savePred = function () {
      if (!appState.user || appState.user.isAdmin) return;
      var m = findMatch(appState.currentId);
      var h = parseInt(el("pred-h").value, 10);
      var a = parseInt(el("pred-a").value, 10);
      if (!m || m.finished || isNaN(h) || isNaN(a) || h < 0 || a < 0) return;
      m.preds[appState.user.code] = { h: h, a: a };
      setTxt("pred-ok", "Prono enregistré : " + h + " - " + a);
      fetch(window.DB_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ matches: window.MATCHES, members: window.MEMBERS })
      }).catch(function () {});
      renderLeaderboard(m);
    };

    function bindLoginFallback() {
      var btn = el("btn-login");
      var inp = el("code-in");
      if (btn) btn.onclick = window.doLogin;
      if (inp) {
        inp.onkeydown = function (e) {
          e = e || window.event;
          if (e && (e.key === "Enter" || e.keyCode === 13)) {
            if (e.preventDefault) e.preventDefault();
            window.doLogin();
          }
        };
      }
    }

    bindLoginFallback();
    document.addEventListener("DOMContentLoaded", bindLoginFallback);

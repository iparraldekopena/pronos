<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Classement Journée 13</title>
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #141820;
      --surface-2: #1b202b;
      --focus-bg: #000000;
      --border: #2a3140;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --gold: #f59e0b;
      --me-bg: rgba(59, 130, 246, 0.14);
      --me-border: rgba(59, 130, 246, 0.45);
      --champ-bg: rgba(245, 158, 11, 0.12);
      --up: #16a34a;
      --down: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px 60px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Logo en haut au centre avec contour rouge */
    .hero-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .hero-logo-frame {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 14px;
      border: 2.5px solid #dc2626;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.25), 0 8px 24px rgba(220, 38, 38, 0.28);
      max-width: 100%;
    }

    .hero-logo-img {
      display: block;
      max-width: 100%;
      width: 680px;
      max-height: 155px;
      object-fit: contain;
      border-radius: 8px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #252c3b;
    }

    button.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    button.btn-red {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-red:hover {
      background: var(--accent-hover);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .login-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
    }

    .err {
      color: #fb7185;
      margin-top: 8px;
      min-height: 1.2em;
      font-size: 0.92rem;
    }

    .aupa-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 22px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .aupa-heading {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .aupa-stats {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Bloc Match Focus */
    .match-focus {
      background: var(--focus-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .match-selector-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .match-title {
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 800;
      margin: 0 0 8px;
    }

    .match-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .pred-box {
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid #1f2430;
    }

    .pred-teams-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .team-big {
      font-size: 1.25rem;
      font-weight: 800;
      min-width: 140px;
    }

    .score-input {
      width: 68px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .pred-ok {
      margin-top: 8px;
      color: #4ade80;
      font-weight: 600;
      min-height: 1.2em;
    }

    /* Carte Classement style capture */
    .standings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .standings-top {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .standings-main-title {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .participation-banner {
      background: var(--surface-2);
      border-left: 4px solid var(--accent);
      padding: 11px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .cumul-sub {
      color: #ef4444;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 8px;
    }

    .revealed-note {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #10141c;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    thead th.right {
      text-align: right;
    }

    tbody td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.row-champ {
      background: var(--champ-bg);
    }

    tbody tr.row-me {
      background: var(--me-bg);
      outline: 1px solid var(--me-border);
    }

    .pos-cell {
      font-weight: 700;
      white-space: nowrap;
      min-width: 56px;
    }

    .arrow-up {
      color: var(--up);
      font-size: 0.8rem;
      margin-left: 4px;
    }

    .arrow-down {
      color: var(--down);
      font-size: 0.8rem;
      margin-left: 4px;
    }

    .member-name {
      font-weight: 600;
    }

    .medal {
      margin-right: 4px;
      font-size: 0.95rem;
    }

    .trophy-icon {
      margin-left: 3px;
      font-size: 0.95rem;
    }

    .tenant-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      font-size: 0.74rem;
      font-weight: 800;
      vertical-align: middle;
    }

    .me-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 700;
      vertical-align: middle;
    }

    .prono-cell {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .gain-pos {
      color: var(--up);
      font-weight: 700;
      margin-left: 4px;
    }

    .gain-zero {
      color: var(--muted);
      font-weight: 600;
      margin-left: 4px;
    }

    .total-cell {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    /* Palmarès */
    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .palm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .palm-card.is-holder {
      border-color: var(--gold);
    }

    .palm-head {
      background: var(--surface-2);
      padding: 12px 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    .palm-rows {
      padding: 10px 16px;
    }

    .palm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .palm-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero-logo-wrap">
      <div class="hero-logo-frame">
        <img
          id="pena-logo"
          class="hero-logo-img"
          src="LOGO IPARRALDEKO PENA (2) copie.jpg"
          alt="Logo Iparraldeko Peña"
        />
      </div>
    </header>

    <div class="top-bar">
      <div class="brand">IPARRALDEKO PEÑA</div>
      <div id="nav" class="nav hidden">
        <button id="tab-pronos" type="button" class="active" onclick="window.setTab('pronos')">Pronostics & Classement</button>
        <button id="tab-palm" type="button" onclick="window.setTab('palm')">Palmarès</button>
        <button type="button" onclick="window.doLogout()">Déconnexion</button>
      </div>
    </div>

    <div id="member-logo" class="muted hidden" style="margin-bottom: 12px;">Espace Membres — Saison en cours</div>

    <section id="sec-login" class="card">
      <h1 style="margin: 0 0 8px; font-size: 1.35rem;">Connexion joueur</h1>
      <p class="muted" style="margin: 0;">Saisis ton code membre pour accéder aux pronostics et au classement.</p>
      <div class="login-row">
        <input id="code-in" type="text" placeholder="Ex. ALAIN-01" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();window.doLogin();}" />
        <button type="button" class="btn-red" onclick="window.doLogin()">Entrer</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <section id="aupa-banner" class="aupa-banner hidden">
      <div>
        <h2 id="aupa-heading" class="aupa-heading">AUPA !</h2>
        <div id="aupa-sub" class="muted"></div>
      </div>
      <div id="aupa-stats" class="aupa-stats"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <section class="match-focus">
        <div class="match-selector-bar">
          <select id="match-select" onchange="window.showMatch(this.value)"></select>
        </div>
        <h2 id="match-title" class="match-title"></h2>
        <div id="match-meta" class="match-meta"></div>

        <div id="pred-box" class="pred-box hidden">
          <div class="pred-teams-row">
            <span id="lbl-home" class="team-big"></span>
            <input id="pred-h" class="score-input" type="number" min="0" max="99" placeholder="-" />
            <span class="score-sep">-</span>
            <input id="pred-a" class="score-input" type="number" min="0" max="99" placeholder="-" />
            <span id="lbl-away" class="team-big"></span>
          </div>
          <button type="button" class="btn-red" onclick="window.savePred()">Valider Prono</button>
          <div id="pred-ok" class="pred-ok"></div>
        </div>
      </section>

      <section class="standings-card">
        <div class="standings-top">
          <h2 id="standings-title" class="standings-main-title">CLASSEMENT À L'ISSUE DE LA JOURNÉE 13</h2>
          <div id="participation-banner" class="participation-banner"></div>
          <div id="cumul-sub" class="cumul-sub"></div>
          <div id="revealed-note" class="revealed-note">🔒 Pronostics révélés (match commencé)</div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>POS</th>
                <th>MEMBRE</th>
                <th id="th-prono" class="right">PRONO N°13</th>
                <th class="right">TOTAL</th>
              </tr>
            </thead>
            <tbody id="lb-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <section id="view-palm" class="hidden">
      <div id="palm-grid" class="palm-grid"></div>
    </section>
  </div>

  <script>
    window.DB_URL = window.DB_URL || "";
    window.LOGO_SRC = window.LOGO_SRC || "LOGO IPARRALDEKO PENA (2) copie.jpg";

    // 26 joueurs (sans SEDEILLAN Jean, avec LEGRAS Peio)
    window.MEMBERS = [
      { code: "LOREA-01", name: "LABORDE Lorea", pos: "1", arrow: "", medal: "🥇", cups: 2, isTenant: false, prono13: "2 - 0", gain13: 1, points: 36 },
      { code: "ANDONI-02", name: "URREIZTIETA Andoni", pos: "2", arrow: "", medal: "🥈", cups: 1, isTenant: false, prono13: "2 - 1", gain13: 1, points: 35 },
      { code: "JULEN-03", name: "LABORDE Julen", pos: "3", arrow: "", medal: "🥉", cups: 1, isTenant: true, prono13: "1 - 0", gain13: 1, points: 29 },

      { code: "DULONG-01", name: "DULONG Xina", pos: "7", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "3 - 1", gain13: 1, points: 25 },

      { code: "MENDIOLA-L", name: "MENDIOLA Lander", pos: "", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "2 - 1", gain13: 1, points: 23 },
      { code: "SANCHEZ-01", name: "SANCHEZ Gorka", pos: "", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "2 - 0", gain13: 1, points: 23 },
      { code: "CURUTCHARRY-01", name: "CURUTCHARRY Pierre", pos: "11", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "1 - 1", gain13: 1, points: 22 },

      { code: "MARITORENA-01", name: "MARITORENA Christophe", pos: "", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "3 - 0", gain13: 1, points: 20 },
      { code: "MENDIOLA-I", name: "MENDIOLA Iñaki", pos: "", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "2 - 1", gain13: 1, points: 20 },
      { code: "CAZAURAN-01", name: "CAZAURAN Jean-Yves", pos: "16", arrow: "up", medal: "", cups: 0, isTenant: false, prono13: "2 - 1", gain13: 1, points: 19 },
      { code: "CROUZAT-F", name: "CROUZAT Frédéric", pos: "", arrow: "up", medal: "", cups: 0, isTenant: false, prono13: "4 - 1", gain13: 1, points: 19 },
      { code: "ROCHE-01", name: "ROCHE Pierrick", pos: "", arrow: "down", medal: "", cups: 1, isTenant: false, prono13: "-", gain13: 0, points: 19 },
      { code: "CROUZAT-L", name: "CROUZAT Luken", pos: "19", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "2 - 0", gain13: 1, points: 15 },
      { code: "GOBBI-01", name: "GOBBI Olivier", pos: "20", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "1 - 0", gain13: 1, points: 14 },
      { code: "GOYENEIX-01", name: "GOYENEIX Pierre", pos: "21", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "2 - 0", gain13: 1, points: 12 },
      { code: "FERNANDEZ-01", name: "FERNANDEZ Adrian", pos: "22", arrow: "", medal: "", cups: 1, isTenant: false, prono13: "-", gain13: 0, points: 8 },
      { code: "ESCALANTE-01", name: "ESCALANTE Ange", pos: "23", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "-", gain13: 0, points: 3 },
      { code: "CROUZAT-I", name: "CROUZAT Inko", pos: "24", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "-", gain13: 0, points: 2 },
      { code: "DIAZ-DEBAT-01", name: "DIAZ-DEBAT Bertrand", pos: "25", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "-", gain13: 0, points: 1 },
      { code: "BARRUTIA-01", name: "BARRUTIA Xabier", pos: "26", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "-", gain13: 0, points: 0 },
      { code: "LEGRAS-01", name: "LEGRAS Peio", pos: "", arrow: "", medal: "", cups: 0, isTenant: false, prono13: "-", gain13: 0, points: 0 }
    ];

    window.MATCHES = [
      { id: "m13", num: 13, comp: "Liga", dayName: "vendredi", date: "20 novembre 2026", time: "21:00", stadium: "San Mamés", home: "ATHLETIC CLUB", away: "RCD ESPANYOL", finished: true, fh: 0, fa: 1 },
      { id: "m14", num: 14, comp: "Liga", dayName: "samedi", date: "28 novembre 2026", time: "16:15", stadium: "La Rosaleda", home: "MALAGA CF", away: "ATHLETIC CLUB", finished: false, fh: null, fa: null }
    ];

    window.PALM = [
      {
        title: "Tenant du Titre",
        holder: "JULEN-03",
        rows: [{ rank: "🏆", name: "LABORDE Julen", detail: "Champion en titre" }]
      },
      {
        title: "Coupes de la Peña",
        holder: "LOREA-01",
        rows: [
          { rank: "🏆", name: "LABORDE Lorea", detail: "2 trophées" },
          { rank: "🏆", name: "URREIZTIETA Andoni", detail: "1 trophée" },
          { rank: "🏆", name: "LABORDE Julen", detail: "1 trophée" },
          { rank: "🏆", name: "CORDEIRO Jonathan", detail: "1 trophée" },
          { rank: "🏆", name: "ROCHE Pierrick", detail: "1 trophée" },
          { rank: "🏆", name: "FERNANDEZ Adrian", detail: "1 trophée" }
        ]
      }
    ];

    let currentUser = null;
    let currentMatchId = "m13";
    let remoteData = { preds: {} };

    const logoEl = document.getElementById("pena-logo");
    if (logoEl && window.LOGO_SRC) {
      logoEl.src = window.LOGO_SRC;
    }

    function ptsWord(n) {
      return (n === 0 || n === 1) ? "pt" : "pts";
    }

    function getFirstName(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(/\s+/);
      return parts[parts.length - 1];
    }

    async function loadRemoteData() {
      if (!window.DB_URL) return;
      try {
        const res = await fetch(window.DB_URL + "?t=" + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json && typeof json === "object") {
            remoteData = { preds: json.preds || {} };
          }
        }
      } catch (e) {
        console.warn("Erreur lecture base :", e);
      }
    }

    async function saveRemoteData() {
      if (!window.DB_URL) return;
      try {
        await fetch(window.DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(remoteData)
        });
      } catch (e) {
        console.warn("Erreur sauvegarde base :", e);
      }
    }

    window.setTab = function(tab) {
      const isPronos = (tab === "pronos");
      document.getElementById("view-pronos").classList.toggle("hidden", !isPronos);
      document.getElementById("view-palm").classList.toggle("hidden", isPronos);
      document.getElementById("tab-pronos").classList.toggle("active", isPronos);
      document.getElementById("tab-palm").classList.toggle("active", !isPronos);
      if (!isPronos) renderPalm();
    };

    window.doLogin = async function() {
      const inputEl = document.getElementById("code-in");
      const errEl = document.getElementById("login-err");
      const raw = (inputEl ? inputEl.value : "").trim().toUpperCase();
      if (errEl) errEl.textContent = "";

      if (!raw) {
        if (errEl) errEl.textContent = "Merci de saisir un code.";
        return;
      }

      if (raw === "ADMIN-PENA") {
        currentUser = { code: "ADMIN-PENA", name: "Administrateur Peña", points: 0, isAdmin: true };
      } else {
        const found = window.MEMBERS.find(m => String(m.code || "").trim().toUpperCase() === raw);
        if (!found) {
          if (errEl) errEl.textContent = `Code "${raw}" non trouvé.`;
          return;
        }
        currentUser = { ...found, isAdmin: false };
      }

      try {
        await loadRemoteData();
      } catch (e) {
        console.warn("Connexion sans base distante :", e);
      }

      document.getElementById("sec-login").classList.add("hidden");
      document.getElementById("member-logo").classList.remove("hidden");
      document.getElementById("aupa-banner").classList.remove("hidden");
      document.getElementById("nav").classList.remove("hidden");
      document.getElementById("view-pronos").classList.remove("hidden");

      const firstName = currentUser.isAdmin ? "ADMIN" : getFirstName(currentUser.name).toUpperCase();
      document.getElementById("aupa-heading").textContent = `AUPA ${firstName} !`;
      document.getElementById("aupa-sub").textContent = currentUser.isAdmin
        ? "Mode administrateur actif"
        : `Code : ${currentUser.code}`;
      document.getElementById("aupa-stats").textContent = currentUser.isAdmin
        ? `${window.MEMBERS.length} joueurs`
        : `${currentUser.points} ${ptsWord(currentUser.points)}`;

      populateMatchSelect();
      window.showMatch(currentMatchId);
      renderPalm();
    };

    window.doLogout = function() {
      currentUser = null;
      document.getElementById("code-in").value = "";
      document.getElementById("login-err").textContent = "";
      document.getElementById("sec-login").classList.remove("hidden");
      document.getElementById("member-logo").classList.add("hidden");
      document.getElementById("aupa-banner").classList.add("hidden");
      document.getElementById("nav").classList.add("hidden");
      document.getElementById("view-pronos").classList.add("hidden");
      document.getElementById("view-palm").classList.add("hidden");
    };

    function populateMatchSelect() {
      const sel = document.getElementById("match-select");
      sel.innerHTML = "";
      window.MATCHES.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `Journée ${m.num} — ${m.home} vs ${m.away} (${m.date})`;
        sel.appendChild(opt);
      });
      sel.value = currentMatchId;
    }

    window.showMatch = function(matchId) {
      currentMatchId = matchId;
      const m = window.MATCHES.find(x => x.id === matchId) || window.MATCHES[0];
      document.getElementById("match-select").value = m.id;
      document.getElementById("th-prono").textContent = `PRONO N°${m.num}`;
      document.getElementById("standings-title").textContent = `CLASSEMENT À L'ISSUE DE LA JOURNÉE ${m.num}`;
      document.getElementById("cumul-sub").textContent = `Classement cumulé à la fin de la Journée ${m.num} (${m.dayName} ${m.date})`;
      document.getElementById("pred-ok").textContent = "";

      const titleEl = document.getElementById("match-title");
      const metaEl = document.getElementById("match-meta");
      const predBox = document.getElementById("pred-box");

      if (m.finished) {
        titleEl.textContent = `${m.home} ${m.fh}-${m.fa} ${m.away}`;
        metaEl.textContent = `Journée ${m.num} - ${m.comp} - ${m.dayName} ${m.date} - ${m.time} - ${m.stadium}`;
        predBox.classList.add("hidden");
      } else {
        titleEl.textContent = `Journée ${m.num} - ${m.dayName} ${m.date} ${m.time} - ${m.stadium}`;
        metaEl.textContent = `${m.comp} — Pronostic ouvert`;
        predBox.classList.remove("hidden");
        document.getElementById("lbl-home").textContent = m.home;
        document.getElementById("lbl-away").textContent = m.away;

        const existing = (remoteData.preds && remoteData.preds[m.id] && currentUser)
          ? remoteData.preds[m.id][currentUser.code]
          : null;
        document.getElementById("pred-h").value = existing ? existing.h : "";
        document.getElementById("pred-a").value = existing ? existing.a : "";
      }

      renderLeaderboard(m);
    };

    window.savePred = async function() {
      const okEl = document.getElementById("pred-ok");
      okEl.textContent = "";
      if (!currentUser || currentUser.isAdmin) {
        okEl.textContent = "Connecte-toi avec un code joueur pour valider un prono.";
        return;
      }

      const hVal = document.getElementById("pred-h").value;
      const aVal = document.getElementById("pred-a").value;
      if (hVal === "" || aVal === "") {
        okEl.textContent = "Merci de saisir les deux scores.";
        return;
      }

      if (!remoteData.preds[currentMatchId]) {
        remoteData.preds[currentMatchId] = {};
      }
      remoteData.preds[currentMatchId][currentUser.code] = {
        h: Number(hVal),
        a: Number(aVal)
      };

      await saveRemoteData();
      okEl.textContent = "Prono enregistré !";
      const m = window.MATCHES.find(x => x.id === currentMatchId) || window.MATCHES[0];
      renderLeaderboard(m);
    };

    function renderLeaderboard(matchObj) {
      const tbody = document.getElementById("lb-body");
      const banner = document.getElementById("participation-banner");
      tbody.innerHTML = "";

      const totalMembers = window.MEMBERS.length;
      const matchPreds = (remoteData.preds && remoteData.preds[currentMatchId]) || {};

      let submitted = 0;
      window.MEMBERS.forEach(m => {
        const p = matchPreds[m.code];
        const hasRemote = p && p.h !== undefined && p.a !== undefined && p.h !== "" && p.a !== "";
        const hasStatic = (matchObj && matchObj.num === 13 && m.prono13 && m.prono13 !== "-");
        if (hasRemote || hasStatic) submitted++;
      });

      const pct = totalMembers > 0 ? Math.round((submitted / totalMembers) * 100) : 0;
      banner.textContent = `Taux de Participation pour la journée ${matchObj ? matchObj.num : 13} : ${pct}% (${submitted}/${totalMembers} participants)`;

      window.MEMBERS.forEach(m => {
        const p = matchPreds[m.code];
        let pronoStr = "-";
        let gain = 0;

        if (p && p.h !== undefined && p.a !== undefined && p.h !== "" && p.a !== "") {
          pronoStr = `${p.h} - ${p.a}`;
          if (matchObj && matchObj.finished && matchObj.fh !== null && matchObj.fa !== null) {
            const predDiff = Number(p.h) - Number(p.a);
            const realDiff = Number(matchObj.fh) - Number(matchObj.fa);
            const sameSign = (predDiff > 0 && realDiff > 0) || (predDiff < 0 && realDiff < 0) || (predDiff === 0 && realDiff === 0);
            gain = sameSign ? 1 : 0;
          }
        } else if (matchObj && matchObj.num === 13 && m.prono13) {
          pronoStr = m.prono13;
          gain = m.gain13 || 0;
        }

        const arrowHtml = m.arrow === "up"
          ? `<span class="arrow-up">▲</span>`
          : (m.arrow === "down" ? `<span class="arrow-down">▼</span>` : "");

        const medalHtml = m.medal ? `<span class="medal">${m.medal}</span>` : "";
        const cupsHtml = m.cups > 0 ? `<span class="trophy-icon">${"🏆".repeat(m.cups)}</span>` : "";
        const tenantHtml = m.isTenant ? `<span class="tenant-badge">Tenant du Titre</span>` : "";
        const meBadge = (currentUser && !currentUser.isAdmin && currentUser.code === m.code)
          ? `<span class="me-badge">Moi</span>`
          : "";

        const gainHtml = gain > 0
          ? `<span class="gain-pos">(+${gain} ${ptsWord(gain)})</span>`
          : `<span class="gain-zero">(+0 pt)</span>`;

        const tr = document.createElement("tr");
        if (m.isTenant) tr.classList.add("row-champ");
        if (currentUser && !currentUser.isAdmin && currentUser.code === m.code) tr.classList.add("row-me");

        tr.innerHTML = `
          <td class="pos-cell">${m.pos || ""}${arrowHtml}</td>
          <td><span class="member-name">${medalHtml}${m.name}</span>${cupsHtml}${tenantHtml}${meBadge}</td>
          <td class="prono-cell">${pronoStr} ${gainHtml}</td>
          <td class="total-cell">${m.points} ${ptsWord(m.points)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPalm() {
      const grid = document.getElementById("palm-grid");
      grid.innerHTML = "";

      window.PALM.forEach(bloc => {
        const isHolder = currentUser && !currentUser.isAdmin && currentUser.code === bloc.holder;
        const card = document.createElement("div");
        card.className = "palm-card" + (isHolder ? " is-holder" : "");

        const rowsHtml = bloc.rows.map(r => `
          <div class="palm-row">
            <span>${r.rank}</span>
            <span><strong>${r.name}</strong></span>
            <span class="muted" style="margin-left:auto;">${r.detail}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="palm-head">${bloc.title}</div>
          <div class="palm-rows">${rowsHtml}</div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --card-2: #ffffff;
      --border: #e2e6ec;
      --text: #161b22;
      --muted: #57606a;
      --accent: #cf222e;
      --accent-2: #1a7f37;
      --gold: #9a6700;
      --gold-bg: #fff8c5;
      --champ-bg: #e8f7ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      background: var(--bg);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
    }
    .logo-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .logo-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: var(--text);
    }
    .logo-sub {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo-right {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sync-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    button, select, input, textarea {
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.92rem;
    }
    button { cursor: pointer; font-weight: 600; }
    button:hover { background: #f6f8fa; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    button.primary:hover { background: #a40e26; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }
    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .match-title { font-size: 1.2rem; font-weight: 800; color: var(--text); }
    .pill {
      background: var(--gold-bg);
      border: 1px solid #d4a72c;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 700;
    }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .err { color: #cf222e; font-size: 0.88rem; margin-top: 8px; font-weight: 600; }
    .ok { color: var(--accent-2); font-size: 0.88rem; margin-top: 8px; font-weight: 600; }
    .hidden { display: none !important; }
    .score-inputs { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .score-inputs input { width: 72px; text-align: center; font-weight: 700; font-size: 1.05rem; background: #ffffff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #ffffff; }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      background: #ffffff;
    }
    th {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      background: #ffffff;
    }
    th.prono-col, td.prono-col {
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      border-bottom-color: #2a2a2a;
    }
    th.prono-col {
      color: #ffffff;
    }
    td.pts-col {
      font-weight: 700;
    }
    tr.champ td {
      background: var(--champ-bg);
    }
    tr.champ td.prono-col {
      background: #111111;
      color: #ffffff;
    }

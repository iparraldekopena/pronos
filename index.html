<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iparraldeko Peña — Pronostics</title>
  <style>
    :root {
      --bg-page: #f6f7f9;
      --bg-card: #ffffff;
      --bg-white: #ffffff;
      --text-main: #14181f;
      --text-muted: #5b6575;
      --border: #e3e7ee;
      --accent: #c81d25;
      --accent-soft: #fde8ea;
      --accent-border: #f3b4ba;
      --green-soft: #e6f6ec;
      --green-text: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    .top-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .top-meta {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-club {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #d91e2a 0%, #9b1118 100%);
      border: 3px solid #7d0b11;
      box-shadow: 0 8px 22px rgba(200, 29, 37, 0.28);
    }

    .logo-img {
      max-width: 100%;
      width: 680px;
      height: auto;
      border-radius: 10px;
      border: 3px solid #ffffff;
      display: block;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .aupa-banner {
      width: 100%;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .aupa-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(20, 24, 31, 0.04);
    }

    .match-focus-dark {
      background: #111317;
      color: #ffffff;
      border-radius: 14px;
      padding: 22px 18px;
      margin-top: 8px;
      text-align: center;
    }

    .match-focus-title {
      margin: 0 0 8px;
      font-size: 1.95rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .match-focus-meta {
      color: #e5e7eb;
      font-size: 0.98rem;
      font-weight: 700;
      text-align: center;
    }

    .pred-box-dark {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #2a2f3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .pred-inputs-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 1.55rem;
      font-weight: 900;
    }

    .btn-valider-rouge {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 11px 24px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cfd6e0;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--text-main);
    }

    button { cursor: pointer; font-weight: 700; }
    button.primary, button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .err { color: var(--accent); font-weight: 700; margin-top: 8px; }
    .ok { color: var(--green-text); font-weight: 700; margin-top: 8px; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-white);
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      background: var(--bg-white);
      color: var(--text-main);
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    th.prono-col, td.prono-col {
      background: var(--bg-white);
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      border-left: 1px solid #edf0f5;
      border-right: 1px solid #edf0f5;
    }

    td.pts-col { font-weight: 800; text-align: right; }

    tr.row-champ td, tr.row-champ td.prono-col { background: var(--accent-soft); }
    tr.row-me td, tr.row-me td.prono-col { background: var(--green-soft); }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .tag-champ { background: #fbd2d7; color: #8f131b; }
    .tag-me { background: #c7ebd4; color: var(--green-text); }

    .cup-plain {
      display: inline-block;
      margin-left: 6px;
      background: transparent;
      border: none;
      padding: 0;
      letter-spacing: 1px;
      font-size: 0.95rem;
      line-height: 1;
      vertical-align: middle;
    }

    .palm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .palm-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-white);
    }

    .palm-card.is-holder {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .palm-head {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }

    .palm-card.is-holder .palm-head {
      background: var(--accent-soft);
      border-bottom-color: var(--accent-border);
    }

    .palm-rows { padding: 12px 14px; display: grid; gap: 7px; }

    .palm-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #eef1f5;
      background: #ffffff;
      font-size: 0.9rem;
    }

    .palm-row.p1 {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      font-weight: 800;
    }

    .palm-rank { font-weight: 800; min-width: 34px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top-header">
      <div class="top-meta">
        <span>SAISON 2026/27 • PRONOSTICS DE LA PEÑA</span>
        <span class="badge-club">Iparraldeko Peña • Athletic Club</span>
      </div>

      <div id="member-logo" class="logo-wrap hidden">
        <img
          src="./logo-pena.jpg"
          alt="Logo Iparraldeko Peña — Athletic Club"
          class="logo-img"
        />
      </div>

      <div id="aupa-banner" class="aupa-banner hidden">
        <div>
          <div id="aupa-heading" class="aupa-title">AUPA</div>
          <div id="aupa-sub" class="muted"></div>
        </div>
        <div id="aupa-stats" class="muted" style="font-weight:700;"></div>
      </div>

      <nav id="nav" class="nav-bar hidden">
        <button id="tab-pronos" class="active" type="button" onclick="window.setTab('pronos')">Pronos & Classement</button>
        <button id="tab-palm" type="button" onclick="window.setTab('palm')">Palmarès</button>
        <button id="btn-logout" type="button" onclick="window.doLogout()">Déconnexion</button>
      </nav>
    </header>

    <section id="sec-login" class="card">
      <h2 style="margin-top:0;">Connexion à l'espace membre</h2>
      <p class="muted">Saisis ton code joueur (ex. <strong>ALAIN-08</strong>) ou <strong>ADMIN-PENA</strong>.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="code-in" type="text" placeholder="Ex. ALAIN-08" autocomplete="off" onkeydown="if(event.key==='Enter'||event.keyCode===13) window.doLogin();" />
        <button id="btn-login" class="primary" type="button" onclick="window.doLogin()">Se connecter</button>
      </div>
      <div id="login-err" class="err"></div>
    </section>

    <main id="view-pronos" class="hidden">
      <div class="card">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <label for="match-select" class="muted" style="font-weight:700;">Choisir une journée :</label>
          <select id="match-select" onchange="window.showMatch(this.value)"></select>
        </div>
        <div class="match-focus-dark">
          <h3 id="match-title" class="match-focus-title"></h3>
          <div id="match-meta" class="match-focus-meta"></div>

          <div id="pred-box" class="pred-box-dark hidden">
            <div class="pred-inputs-row">
              <span id="lbl-home"></span>
              <input id="pred-h" type="number" min="0" style="width:78px; text-align:center;" />
              <span>-</span>
              <input id="pred-a" type="number" min="0" style="width:78px; text-align:center;" />
              <span id="lbl-away"></span>
            </div>
            <button id="btn-save-pred" class="btn-valider-rouge" type="button" onclick="window.savePred()">Valider Prono</button>
          </div>
        </div>
        <div id="pred-ok" class="ok"></div>
      </div>

      <div class="card">
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px;">
          <h2 style="margin:0;">Classement général</h2>
          <div id="part-info" class="muted"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Joueur</th>
                <th id="th-prono" class="prono-col">PRONO N° 13</th>
                <th style="text-align:right;">Total</th>
              </tr>
            </thead>
            <tbody id="lb-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <section id="view-palm" class="hidden">
      <div class="card">
        <h2 style="margin-top:0;">Palmarès de la Peña</h2>
        <div id="palm-grid" class="palm-grid"></div>
      </div>
    </section>
  </div>

  <script>
    window.DB_URL = "https://iparraldeko-pena-default-rtdb.europe-west1.firebasedatabase.app/data.json";

    window.MEMBERS = [
      { code: "JORGE-13", name: "ARIAS RUIZ Jorge", points: 20, isChamp: false },
      { code: "XABIER-26", name: "BARRUTIA Xabier", points: 0, isChamp: false },
      { code: "JEANYVES-18", name: "CAZAURAN Jean-Yves", points: 18, isChamp: false },
      { code: "JONATHAN-05", name: "CORDEIRO Jonathan", points: 27, isChamp: false },
      { code: "FREDERIC-17", name: "CROUZAT Frédéric", points: 19, isChamp: false },
      { code: "INKO-24", name: "CROUZAT Inko", points: 2, isChamp: false },
      { code: "LUKEN-19", name: "CROUZAT Luken", points: 15, isChamp: false },
      { code: "PIERRE-10", name: "CURUTCHARRY Pierre", points: 22, isChamp: false },
      { code: "BERTRAND-25", name: "DIAZ-DEBAT Bertrand", points: 1, isChamp: false },
      { code: "XINA-07", name: "DULONG Xina", points: 25, isChamp: false },
      { code: "ANGE-23", name: "ESCALANTE Ange", points: 3, isChamp: false },
      { code: "ADRIAN-22", name: "FERNANDEZ Adrian", points: 8, isChamp: false },
      { code: "OLIVIER-20", name: "GOBBI Olivier", points: 14, isChamp: false },
      { code: "PIERRE-21", name: "GOYENEIX Pierre", points: 12, isChamp: false },
      { code: "ALAIN-08", name: "LABORDE Alain", points: 23, isChamp: false },
      { code: "JULEN-03", name: "LABORDE Julen", points: 29, isChamp: true },
      { code: "LOREA-01", name: "LABORDE Lorea", points: 36, isChamp: false },
      { code: "CHRISTOPHE-14", name: "MARITORENA Christophe", points: 20, isChamp: false },
      { code: "INAKI-15", name: "MENDIOLA Iñaki", points: 20, isChamp: false },
      { code: "LANDER-09", name: "MENDIOLA Lander", points: 23, isChamp: false },
      { code: "XABIER-04", name: "PARRILLA ETCHART Xabier", points: 28, isChamp: false },
      { code: "JEANLOUIS-06", name: "PONTACQ Jean-Louis", points: 26, isChamp: false },
      { code: "YANNICK-11", name: "QUEYROU Yannick", points: 22, isChamp: false },
      { code: "PIERRICK-16", name: "ROCHE Pierrick", points: 19, isChamp: false },
      { code: "GORKA-12", name: "SANCHEZ Gorka", points: 21, isChamp: false },
      { code: "JEAN-28", name: "SEDEILLAN Jean", points: 0, isChamp: false },
      { code: "ANDONI-02", name: "URREIZTIETA Andoni", points: 35, isChamp: false }
    ];
window.MATCHES = [
      { id: "m13", num: 13, comp: "Liga", dayName: "Vendredi", date: "20 Novembre", time: "21:00", stadium: "San Mamés", home: "ATHLETIC CLUB", away: "RCD ESPANYOL", finished: true, fh: 0, fa: 1 },
      { id: "m14", num: 14, comp: "Liga", dayName: "samedi", date: "28 novembre", time: "16:15", stadium: "La Rosaleda", home: "MALAGA CF", away: "ATHLETIC CLUB", finished: false, fh: null, fa: null }
    ];

    window.PALM = [
      {
        title: "Champion en titre",
        holder: "JULEN-03",
        rows: [
          { rank: "1er", name: "LABORDE Julen", detail: "Saison 2025/26" }
        ]
      },
      {
        title: "Coupes de la Peña",
        holder: "LOREA-01",
        rows: [
          { rank: "🏆", name: "LABORDE Lorea", detail: "Coupe d'Hiver" },
          { rank: "🏆", name: "URREIZTIETA Andoni", detail: "Coupe de Printemps" }
        ]
      }
    ];

    let currentUser = null;
    let currentMatchId = "m14";
    let remoteData = { preds: {} };

    function ptsLabel(n) {
      return (n === 0 || n === 1) ? "point" : "pts";
    }

    function cupIcons(code) {
      const count = (code === "LOREA-01") ? 2 : (code === "ANDONI-02" ? 1 : 0);
      if (!count) return "";
      return `<span class="cup-plain">${"🏆".repeat(count)}</span>`;
    }

    async function loadRemoteData() {
      try {
        const res = await fetch(window.DB_URL + "?t=" + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json && typeof json === "object") {
            remoteData = { preds: json.preds || {} };
          }
        }
      } catch (e) {
        console.warn("Erreur lecture base :", e);
      }
    }

    async function saveRemoteData() {
      try {
        await fetch(window.DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(remoteData)
        });
      } catch (e) {
        console.warn("Erreur sauvegarde base :", e);
      }
    }

    window.setTab = function(tab) {
      const isPronos = (tab === "pronos");
      document.getElementById("view-pronos").classList.toggle("hidden", !isPronos);
      document.getElementById("view-palm").classList.toggle("hidden", isPronos);
      document.getElementById("tab-pronos").classList.toggle("active", isPronos);
      document.getElementById("tab-palm").classList.toggle("active", !isPronos);
      if (!isPronos) renderPalm();
    };

    window.doLogin = async function() {
      const raw = (document.getElementById("code-in").value || "").trim().toUpperCase();
      const errEl = document.getElementById("login-err");
      errEl.textContent = "";

      if (raw === "ADMIN-PENA") {
        currentUser = { code: "ADMIN-PENA", name: "Administrateur Peña", points: 0, isChamp: false, isAdmin: true };
      } else {
        const found = window.MEMBERS.find(m => m.code.toUpperCase() === raw);
        if (!found) {
          errEl.textContent = "Code joueur inconnu.";
          return;
        }
        currentUser = { ...found, isAdmin: false };
      }

      await loadRemoteData();

      document.getElementById("sec-login").classList.add("hidden");
      document.getElementById("member-logo").classList.remove("hidden");
      document.getElementById("aupa-banner").classList.remove("hidden");
      document.getElementById("nav").classList.remove("hidden");
      document.getElementById("view-pronos").classList.remove("hidden");

      document.getElementById("aupa-heading").textContent = `AUPA ${currentUser.name}`;
      document.getElementById("aupa-sub").textContent = currentUser.isAdmin
        ? "Mode administrateur actif"
        : `Code : ${currentUser.code}`;
      document.getElementById("aupa-stats").textContent = currentUser.isAdmin
        ? `${window.MEMBERS.length} joueurs`
        : `${currentUser.points} ${ptsLabel(currentUser.points)}`;

      populateMatchSelect();
      window.showMatch(currentMatchId);
      renderLeaderboard();
      renderPalm();
    };

    window.doLogout = function() {
      currentUser = null;
      document.getElementById("code-in").value = "";
      document.getElementById("login-err").textContent = "";
      document.getElementById("sec-login").classList.remove("hidden");
      document.getElementById("member-logo").classList.add("hidden");
      document.getElementById("aupa-banner").classList.add("hidden");
      document.getElementById("nav").classList.add("hidden");
      document.getElementById("view-pronos").classList.add("hidden");
      document.getElementById("view-palm").classList.add("hidden");
    };

    function populateMatchSelect() {
      const sel = document.getElementById("match-select");
      sel.innerHTML = "";
      window.MATCHES.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `Pronostic ${m.num} — ${m.home} vs ${m.away} (${m.date})`;
        sel.appendChild(opt);
      });
      sel.value = currentMatchId;
    }

    window.showMatch = function(matchId) {
      currentMatchId = matchId;
      const m = window.MATCHES.find(x => x.id === matchId) || window.MATCHES[window.MATCHES.length - 1];
      document.getElementById("match-select").value = m.id;
      document.getElementById("th-prono").textContent = `PRONO N° ${m.num}`;
      document.getElementById("pred-ok").textContent = "";

      const titleEl = document.getElementById("match-title");
      const metaEl = document.getElementById("match-meta");
      const predBox = document.getElementById("pred-box");

      if (m.finished) {
        titleEl.textContent = `${m.home} ${m.fh}-${m.fa} ${m.away}`;
        metaEl.textContent = `Pronostic ${m.num} - ${m.comp} - ${m.dayName} ${m.date} - ${m.time} - ${m.stadium} -`;
        predBox.classList.add("hidden");
      } else {
        titleEl.textContent = `Journée ${m.num} - ${m.dayName} ${m.date} ${m.time} - ${m.stadium}`;
        metaEl.textContent = `${m.comp} — Pronostic ouvert`;
        predBox.classList.remove("hidden");
        document.getElementById("lbl-home").textContent = m.home;
        document.getElementById("lbl-away").textContent = m.away;

        const existing = (remoteData.preds && remoteData.preds[m.id] && currentUser)
          ? remoteData.preds[m.id][currentUser.code]
          : null;
        document.getElementById("pred-h").value = existing ? existing.h : "";
        document.getElementById("pred-a").value = existing ? existing.a : "";
      }

      renderLeaderboard();
    };

    window.savePred = async function() {
      const okEl = document.getElementById("pred-ok");
      okEl.textContent = "";
      if (!currentUser || currentUser.isAdmin) {
        okEl.textContent = "Connecte-toi avec un code joueur pour valider un prono.";
        return;
      }

      const hVal = document.getElementById("pred-h").value;
      const aVal = document.getElementById("pred-a").value;
      if (hVal === "" || aVal === "") {
        okEl.textContent = "Merci de saisir les deux scores.";
        return;
      }

      if (!remoteData.preds[currentMatchId]) {
        remoteData.preds[currentMatchId] = {};
      }
      remoteData.preds[currentMatchId][currentUser.code] = {
        h: Number(hVal),
        a: Number(aVal)
      };

      await saveRemoteData();
      okEl.textContent = "Prono enregistré !";
      renderLeaderboard();
    };

    function renderLeaderboard() {
      const tbody = document.getElementById("lb-body");
      const partInfo = document.getElementById("part-info");
      tbody.innerHTML = "";

      const sorted = [...window.MEMBERS].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
      });

      const matchPreds = (remoteData.preds && remoteData.preds[currentMatchId]) || {};
      const submittedCount = Object.keys(matchPreds).length;
      partInfo.textContent = `${submittedCount} / ${sorted.length} pronos enregistrés`;

      sorted.forEach((m, idx) => {
        const prev = idx > 0 ? sorted[idx - 1] : null;
        const showRank = (idx === 0) || (m.points !== prev.points);
        const rankLabel = showRank ? `${idx + 1}` : "";

        const p = matchPreds[m.code];
        const pronoText = (p && p.h !== undefined && p.a !== undefined) ? `${p.h}-${p.a}` : "—";

        const tr = document.createElement("tr");
        if (m.isChamp) tr.classList.add("row-champ");
        if (currentUser && !currentUser.isAdmin && currentUser.code === m.code) tr.classList.add("row-me");

        const badges = [
          m.isChamp ? `<span class="tag tag-champ">Champion</span>` : "",
          (currentUser && !currentUser.isAdmin && currentUser.code === m.code) ? `<span class="tag tag-me">Moi</span>` : "",
          cupIcons(m.code)
        ].join("");

        tr.innerHTML = `
          <td>${rankLabel}</td>
          <td>${m.name}${badges}</td>
          <td class="prono-col">${pronoText}</td>
          <td class="pts-col">${m.points} ${ptsLabel(m.points)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPalm() {
      const grid = document.getElementById("palm-grid");
      grid.innerHTML = "";

      window.PALM.forEach(bloc => {
        const isHolder = currentUser && !currentUser.isAdmin && currentUser.code === bloc.holder;
        const card = document.createElement("div");
        card.className = "palm-card" + (isHolder ? " is-holder" : "");

        const rowsHtml = bloc.rows.map((r, i) => `
          <div class="palm-row ${i === 0 ? "p1" : ""}">
            <span class="palm-rank">${r.rank}</span>
            <span>${r.name}</span>
            <span class="muted" style="margin-left:auto;">${r.detail}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <div class="palm-head">
            <span>${bloc.title}</span>
          </div>
          <div class="palm-rows">${rowsHtml}</div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
